<style>
:root{
  --bg:#dfe7e2; --bg-deep:#c5d3cb; --surface:rgba(255,255,255,.9); --text:#1d2420; --muted:#56635b; --line:rgba(20,40,30,.14);
  --que:#2b6e57; --que-soft:#e2efe8; --peng:#b8322f; --peng-soft:#f8e3e0; --brass:#b58a2e; --shadow:0 10px 28px rgba(20,40,30,.16);
  --serif:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; --sans:var(--serif); --tile-back:#2b8a5a;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101613; --bg-deep:#0a0e0c; --surface:rgba(24,31,27,.92); --text:#eaefe9; --muted:#a2aea6; --line:rgba(255,255,255,.12);
    --que:#6cc7a0; --que-soft:#183327; --peng:#ff7a70; --peng-soft:#3a1b19; --brass:#e0b552; --shadow:0 10px 28px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101613; --bg-deep:#0a0e0c; --surface:rgba(24,31,27,.92); --text:#eaefe9; --muted:#a2aea6; --line:rgba(255,255,255,.12);
  --que:#6cc7a0; --que-soft:#183327; --peng:#ff7a70; --peng-soft:#3a1b19; --brass:#e0b552; --shadow:0 10px 28px rgba(0,0,0,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;font-family:var(--sans);color:var(--text);
  background:radial-gradient(ellipse 80% 70% at 50% 45%, var(--bg) 0%, var(--bg-deep) 100%);background-color:var(--bg)}
#app{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden}
#stage{position:relative;flex:1;min-height:0}
#stage > canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:manipulation}

header{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:12px 16px;z-index:5;pointer-events:none}
header > *{pointer-events:auto}
.brand small{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.02em;color:var(--muted);margin-top:2px}
.brand small b{font-weight:700;color:var(--text)}
.brand{font-family:"momochidori",var(--sans);margin-right:auto;display:flex;flex-direction:column;line-height:1.15;font-weight:900;font-size:18px;letter-spacing:.06em;white-space:nowrap;padding:7px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.btn{font:600 14px/1 var(--sans);padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;box-shadow:var(--shadow);white-space:nowrap}
.btn.ask{background:var(--que);color:#fff;border-color:transparent}
.btn:focus-visible,.act:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

.panel{position:absolute;top:60px;right:16px;width:min(380px,calc(100% - 32px));z-index:6;background:var(--surface);backdrop-filter:blur(10px);
  border-radius:16px;padding:14px;box-shadow:var(--shadow);border:1px solid var(--line);
  opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .18s,transform .18s}
.panel.open{opacity:1;transform:none;pointer-events:auto}
.panel h3{font-family:"momochidori",var(--sans);font-weight:900;font-size:16px;margin:0 0 10px}
#settings{width:min(310px,calc(100% - 32px));padding:10px 12px 12px}
.tabs{display:flex;gap:4px;padding:3px;border-radius:999px;background:var(--line);margin-bottom:10px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:700 13px var(--sans);padding:7px 4px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.tabs button:focus-visible{outline:3px solid var(--brass)}
.optlist{display:flex;flex-direction:column;gap:4px}
.hint{margin:8px 2px 0;font-size:11.5px;line-height:1.5;color:var(--muted)}
.dots{display:inline-flex;gap:3px;flex:none}
.dots i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.scene{display:flex;align-items:center;gap:10px;padding:9px 12px;width:100%;border:2px solid transparent;border-radius:12px;background:transparent;color:var(--text);cursor:pointer;font:700 14px var(--sans);text-align:left}
.scene[aria-pressed="true"]{border-color:var(--brass)}
.scene:hover{background:var(--line)}
.scene:focus-visible{outline:3px solid var(--brass)}
#swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 2px;min-width:0;border:2px solid transparent;border-radius:12px;background:transparent;color:var(--text);cursor:pointer;font:500 10.5px/1.2 var(--sans);text-align:center}
.swatch canvas{width:30px;height:40px;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15),0 2px 4px rgba(0,0,0,.2)}
.swatch[aria-pressed="true"]{border-color:var(--brass)}
.swatch:hover{background:var(--line)}
.swatch:focus-visible{outline:3px solid var(--brass)}
.skinfoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--muted);gap:10px}

#rules{width:min(520px,calc(100% - 32px));max-height:calc(100% - 80px);overflow-y:auto}
#rules .rrow{display:grid;grid-template-columns:6.5em 1fr auto;gap:10px;align-items:baseline;padding:8px 2px;border-bottom:1px solid var(--line)}
#rules .rrow b{font-weight:900;font-size:15px}
#rules .rrow p{margin:0;font-size:13px;line-height:1.55;color:var(--muted)}
#rules .rrow > span{font-weight:900;color:var(--peng);white-space:nowrap}
#rules .exg{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
#rules .exg .grp{display:inline-flex;gap:2px;padding:3px;border-radius:7px;background:var(--line)}
#rules .exg .grp.wait{background:transparent;outline:2px dashed var(--brass);outline-offset:-1px}
#rules .exg i{font-style:normal;font-size:12px;color:var(--muted)}
#payRule{font-size:13px;margin:10px 2px 0;line-height:1.6}

.dock{flex:none;height:136px;display:grid;grid-template-columns:1fr auto 1fr;gap:16px;padding:12px 16px;
  background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.08);z-index:4}
.dock-mid{display:flex;align-items:center;justify-content:center}
#btnAsk{height:46px;padding:0 20px 0 8px;border-radius:999px;border:0;cursor:pointer;color:#fff;font:900 16px/1 var(--sans);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
  background:linear-gradient(180deg,#3f8f71,#1f5442);box-shadow:0 4px 0 #143a2d,0 8px 18px rgba(0,0,0,.22);transition:transform .08s,box-shadow .08s}
#btnAsk .q{width:30px;height:30px;border-radius:50%;background:#fff;color:#1f5442;display:grid;place-items:center;font-size:17px;font-weight:900}
#btnAsk:hover{filter:brightness(1.06)}
#btnAsk:active{transform:translateY(3px);box-shadow:0 1px 0 #143a2d,0 4px 10px rgba(0,0,0,.22)}
#btnAsk:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.teacher{display:flex;gap:12px;align-items:flex-start;min-width:0;height:100%}
#t-peng{flex-direction:row-reverse}
/* 頭像：之後替換成正式角色立繪，把 .avatar 內的文字換成 <img> 即可 */
.avatar{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:28px;color:#fff;
  box-shadow:0 4px 12px rgba(0,0,0,.18);transition:transform .25s}
#t-que .avatar{background:linear-gradient(150deg,#3f8a6f,#1f5442)}
#t-peng .avatar{background:linear-gradient(150deg,#e2534c,#9c2422)}
.teacher.talking .avatar{transform:translateY(-3px) scale(1.06)}
.say{min-width:0;flex:1;display:flex;flex-direction:column;height:100%}
#t-peng .say{align-items:flex-end}
.name{font-family:var(--serif);font-weight:900;font-size:15px;margin:2px 0 6px}
.name span{font-family:var(--sans);font-weight:500;font-size:12px;color:var(--muted);margin:0 6px}
.bubble{border-radius:14px;padding:9px 13px;font-size:14.5px;line-height:1.6;overflow-y:auto;max-height:100%;min-height:0;flex:1 1 auto;width:100%}
#t-que .bubble{background:var(--que-soft);border-top-left-radius:4px}
#t-peng .bubble{background:var(--peng-soft);border-top-right-radius:4px}
.bubble.pop{animation:pop .32s ease-out}
@keyframes pop{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}

#actions{position:absolute;left:50%;transform:translateX(-50%);display:none;flex-direction:column;gap:10px;align-items:center;z-index:6;max-width:94%}
#actions .btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ftip{max-width:min(520px,92vw);background:#fff8e1;color:#5a4410;border:1px solid #f0d58a;font-size:12.5px;line-height:1.55;padding:7px 12px;border-radius:10px;box-shadow:var(--shadow);text-align:center}
.btn.toggle{display:inline-flex;align-items:center;gap:8px}
.btn.toggle::after{content:"";flex:none;width:34px;height:20px;border-radius:999px;background:#bdbdbd radial-gradient(circle at 10px 10px,#fff 7px,transparent 8px);transition:background .2s}
.btn.toggle[aria-pressed="true"]::after{background:#2f8f5b radial-gradient(circle at 24px 10px,#fff 7px,transparent 8px)}
.btn.toggle[hidden]{display:none}
#tileName{position:absolute;transform:translate(-50%,-150%);z-index:6;pointer-events:none;background:#1d2420;color:#fff;font-size:13px;font-weight:700;padding:4px 10px;border-radius:8px;white-space:nowrap}
#tileName[hidden]{display:none}
#actions.show{display:flex}
#actions .note,#actions .ftip{pointer-events:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .ftip{background:#3a3218;color:#f5e3ad;border-color:#6b5a26} }
.note{background:var(--surface);color:var(--muted);font-size:13px;padding:8px 12px;border-radius:999px;box-shadow:var(--shadow)}
.act{font:900 20px/1 var(--serif);padding:12px 20px;border-radius:12px;border:0;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25),var(--shadow);transition:transform .08s}
.act:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.act.hu{position:relative;background:linear-gradient(120deg,#c62f2b 0%,#ff5a3a 35%,#ffcf5a 50%,#ff5a3a 65%,#c62f2b 100%);background-size:250% 100%;font-size:1.35em;padding-left:1.4em;padding-right:1.4em;letter-spacing:.12em;margin:0 12px;text-shadow:0 2px 0 rgba(90,10,0,.45);
  box-shadow:0 0 0 3px #ffd75e,0 0 22px 6px rgba(255,190,60,.75);animation:huPulse 1.05s ease-in-out infinite,huShine 2.2s linear infinite;z-index:1}
.act.hu::after{content:"";position:absolute;inset:-6px;border-radius:inherit;border:3px solid rgba(255,215,94,.95);animation:huRing 1.05s ease-out infinite;pointer-events:none}
.act.hu::before{content:"✦";position:absolute;right:-10px;top:-14px;font-size:22px;color:#fff3b0;text-shadow:0 0 10px #ffd75e;animation:huTwinkle .9s ease-in-out infinite;pointer-events:none}
@keyframes huPulse{0%,100%{transform:scale(1) rotate(0)}25%{transform:scale(1.1) rotate(-2.5deg)}50%{transform:scale(1.16) rotate(0)}75%{transform:scale(1.1) rotate(2.5deg)}}
@keyframes huShine{from{background-position:100% 0}to{background-position:-150% 0}}
@keyframes huRing{from{transform:scale(.95);opacity:1}to{transform:scale(1.45);opacity:0}}
@keyframes huTwinkle{0%,100%{transform:scale(.6) rotate(0);opacity:.5}50%{transform:scale(1.25) rotate(45deg);opacity:1}}
#winGlow{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .4s;background:radial-gradient(ellipse at 50% 85%,rgba(255,200,70,.35),rgba(255,160,40,.12) 45%,transparent 70%),radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(255,190,60,.28) 100%)}
#winGlow.on{opacity:1;animation:winGlow 1.05s ease-in-out infinite}
@keyframes winGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}
@media (prefers-reduced-motion:reduce){.act.hu,.act.hu::after,.act.hu::before,#winGlow.on{animation:none}}.act.pon{background:#d07a1c}.act.kan{background:#6a4bb0}.act.chi{background:#2b7a55}
.act.pass{background:var(--surface);color:var(--text);border:1px solid var(--line)}

.announce{position:absolute;transform:translate(-50%,-50%);font-family:var(--serif);font-weight:900;font-size:56px;color:#ffe9a8;
  text-shadow:0 3px 0 #7a1a12,0 0 24px rgba(0,0,0,.5);pointer-events:none;z-index:7;animation:ann 1.3s ease-out forwards}
@keyframes ann{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}75%{opacity:1;transform:translate(-50%,-60%) scale(1)}100%{opacity:0;transform:translate(-50%,-75%) scale(1)}}

#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:12}
#result{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,10,8,.45);z-index:9;padding:16px}
#result[hidden]{display:none}
.card{background:var(--surface);backdrop-filter:blur(8px);border-radius:20px;padding:22px 24px;width:min(600px,100%);max-height:100%;overflow-y:auto;box-shadow:var(--shadow);text-align:center}
.card h2{font-family:"momochidori",var(--serif);font-weight:900;font-size:32px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 14px}
.tiles{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:16px}
.chip{font-family:var(--serif);font-weight:900;font-size:13px;writing-mode:vertical-rl;background:#f7f1e1;color:#1b1b1b;border-radius:5px;padding:6px 3px;
  box-shadow:inset 0 -3px 0 var(--tile-back),0 1px 2px rgba(0,0,0,.2);min-height:52px}
.chip[data-suit="0"]{color:#9e1f25}.chip[data-suit="1"]{color:#1f4fa3}.chip[data-suit="2"]{color:#1d7a3e}
.chip.open{opacity:.7}.chip.win{outline:3px solid var(--brass)}
.tai{text-align:left;border-top:1px solid var(--line);margin-bottom:14px}
.tai .row{display:grid;grid-template-columns:6.5em 1fr auto;gap:12px;align-items:start;padding:10px 2px;border-bottom:1px solid var(--line)}
.tai .row > b{font-weight:900;font-size:16px;padding-top:1px}
.tai .body{min-width:0}
.tai .why{margin:0;font-size:14px;line-height:1.55}
.tai .rule{margin:4px 0 0;font-size:12px;line-height:1.5;color:var(--muted)}
.tai .groups{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tai .grp{display:inline-flex;gap:2px;padding:3px;border-radius:7px;background:var(--line)}
.chip.mini{min-height:38px;font-size:11px;padding:4px 2px;border-radius:4px}
.tai .n{font-weight:900;font-size:16px;color:var(--peng);white-space:nowrap}
.tai .total > b,.tai .total .n{font-size:19px}
.tai .pay{margin:10px 2px 0;font-size:14px}
.cardbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* 開局 intro：毛筆字＋鑼聲 */
#intro{position:absolute;inset:0;z-index:11;display:grid;place-items:center;pointer-events:none;background:rgba(5,12,9,.35)}
#intro[hidden]{display:none}
#intro .band{position:relative;width:100%;padding:28px 0 22px;text-align:center;
  background:linear-gradient(180deg,transparent 0,#f4ecd8 10%,#f4ecd8 90%,transparent 100%);transform-origin:center}
#intro .brush{font-family:"Yuji Boku","Kaiti TC","STKaiti","DFKai-SB","BiauKai",serif;font-size:clamp(84px,16vw,190px);line-height:1;color:#141210;letter-spacing:.06em;margin:0}
#intro .round{font-size:15px;font-weight:700;color:#5a4a36;margin-top:10px;letter-spacing:.2em}
#intro .seal{position:absolute;right:calc(50% - min(48vw,330px));top:24%;width:64px;height:64px;border:4px solid #b8322f;border-radius:8px;color:#b8322f;
  font-family:"Yuji Boku","Kaiti TC",serif;font-size:24px;line-height:1.05;display:grid;place-items:center;transform:rotate(-8deg);opacity:0}
#intro.play .band{animation:bandIn .35s ease-out both}
#intro.play .brush{animation:brushIn .55s cubic-bezier(.2,1.4,.4,1) .15s both}
#intro.play .round{animation:fadeIn .4s ease-out .6s both}
#intro.play .seal{animation:stamp .3s ease-out .85s forwards}
#intro.play{animation:fadeIn .2s both, outro .45s ease-in 2.1s forwards}
@keyframes bandIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes brushIn{from{opacity:0;transform:scale(1.5);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes stamp{from{opacity:0;transform:rotate(-8deg) scale(2.2)}to{opacity:.92;transform:rotate(-8deg) scale(1)}}
@keyframes outro{to{opacity:0}}

/* 開始畫面（瀏覽器規定要先點一下才能出聲） */
#resumeBox{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:14px}
#resumeBox[hidden]{display:none}
#start{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(5,12,9,.55);backdrop-filter:blur(3px);padding:16px}
#start[hidden]{display:none}
#start .card h1 .en{display:block;font-size:.5em;letter-spacing:.08em;opacity:.7;margin-top:2px}
.brand .en{font-size:.78em;letter-spacing:.02em}
#start .card h1{font-family:"momochidori",var(--sans);font-weight:900;font-size:34px;margin:0 0 10px;letter-spacing:.02em}
.startcard{width:min(440px,100%);max-height:calc(100% - 8px);overflow-y:auto}
.lead{color:var(--muted);margin:0 0 18px;line-height:1.6}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 10px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;font-family:var(--sans);box-shadow:var(--shadow)}
.mode b{font-family:"momochidori",var(--sans);font-size:18px;font-weight:900}
.mode span{font-size:12px;color:var(--muted)}
.mode.solo{background:var(--que);color:#fff;border-color:transparent}
.mode.solo span{color:rgba(255,255,255,.85)}
.mode:hover{filter:brightness(1.05)}
.mode:focus-visible,.field input:focus-visible,.joinrow input:focus-visible,.linkbtn:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:6px;text-align:left;font-size:13px;color:var(--muted);margin-bottom:12px}
.field input,.joinrow input{font:16px var(--sans);padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.or{font-size:12px;color:var(--muted);margin:16px 0 8px}
.joinrow{display:flex;gap:8px}
.joinrow input{flex:1;min-width:0;text-transform:uppercase;letter-spacing:.3em;text-align:center;font-weight:700}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ================= 牌與基本工具 =================
const NUM = ['一','二','三','四','五','六','七','八','九'];
const HONOR = ['東','南','西','北','中','發','白'];
const SUIT = ['萬','筒','條'];
function tn(t){ return t < 27 ? NUM[t%9] + SUIT[Math.floor(t/9)] : HONOR[t-27]; }
function seqName(arr){ const s = arr.slice().sort((a,b)=>a-b); return s.map(x=>NUM[x%9]).join('') + SUIT[Math.floor(s[0]/9)]; }
function counts(arr){ const c = new Array(34).fill(0); for (const t of arr) c[t]++; return c; }
function sortHand(h){ h.sort((a,b)=>a-b); return h; }
function removeOne(arr,t){ const i = arr.indexOf(t); if (i >= 0) arr.splice(i,1); return i >= 0; }
function removeN(arr,t,n){ for (let k=0;k<n;k++) removeOne(arr,t); }
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

// ================= 向聽數計算（台灣16張：5組＋1對） =================
const _cache = new Map();
function pareto(list){
  const out = [];
  for (const x of list){
    let dom = false;
    for (const y of list){
      if (y === x || y[2] !== x[2]) continue;
      if (y[0] >= x[0] && y[1] >= x[1] && (y[0] > x[0] || y[1] > x[1])) { dom = true; break; }
    }
    if (!dom && !out.some(o => o[0]===x[0] && o[1]===x[1] && o[2]===x[2])) out.push(x);
  }
  return out;
}
// 回傳此花色可達成的 [面子, 搭子, 對子] 組合
function groupOpts(a, honor){
  let i = 0; while (i < a.length && a[i] === 0) i++;
  if (i === a.length) return [[0,0,0]];
  const key = (honor ? 'h' : 's') + a.join('');
  const hit = _cache.get(key); if (hit) return hit;
  const out = [];
  const add = (sub, dm, dt, dp) => { for (const s of sub){ if (dp && s[2]) continue; out.push([s[0]+dm, s[1]+dt, s[2]+dp]); } };
  if (a[i] >= 3){ a[i]-=3; add(groupOpts(a,honor),1,0,0); a[i]+=3; }
  if (!honor && i <= 6 && a[i+1] > 0 && a[i+2] > 0){ a[i]--;a[i+1]--;a[i+2]--; add(groupOpts(a,honor),1,0,0); a[i]++;a[i+1]++;a[i+2]++; }
  if (a[i] >= 2){ a[i]-=2; const s = groupOpts(a,honor); add(s,0,0,1); add(s,0,1,0); a[i]+=2; }
  if (!honor && i <= 7 && a[i+1] > 0){ a[i]--;a[i+1]--; add(groupOpts(a,honor),0,1,0); a[i]++;a[i+1]++; }
  if (!honor && i <= 6 && a[i+2] > 0){ a[i]--;a[i+2]--; add(groupOpts(a,honor),0,1,0); a[i]++;a[i+2]++; }
  a[i]--; add(groupOpts(a,honor),0,0,0); a[i]++;
  const res = pareto(out); _cache.set(key, res); return res;
}
// -1 = 胡牌，0 = 聽牌，n = 還差 n 步聽牌
function calcShanten(c, meldCount){
  const N = 5 - meldCount;
  const g = [groupOpts(c.slice(0,9),false), groupOpts(c.slice(9,18),false), groupOpts(c.slice(18,27),false), groupOpts(c.slice(27,34),true)];
  let best = 99;
  for (const a of g[0]) for (const b of g[1]) for (const d of g[2]) for (const e of g[3]){
    const p = a[2]+b[2]+d[2]+e[2]; if (p > 1) continue;
    const m = a[0]+b[0]+d[0]+e[0], t = a[1]+b[1]+d[1]+e[1];
    const mm = Math.min(m, N), tt = Math.min(t, N - mm);
    const sh = 2*N - 2*mm - tt - p;
    if (sh < best) best = sh;
  }
  return best;
}
function nearby(c, d){
  if (c[d] > 0) return true;
  if (d >= 27) return false;
  const s = Math.floor(d/9)*9, n = d - s;
  for (let k=-2;k<=2;k++){ const m = n+k; if (k !== 0 && m >= 0 && m < 9 && c[s+m] > 0) return true; }
  return false;
}
function ukeire(c, mc, sh, vis){
  let total = 0; const tiles = [];
  for (let d=0; d<34; d++){
    if (c[d] >= 4 || !nearby(c,d)) continue;
    c[d]++; const s = calcShanten(c, mc); c[d]--;
    if (s < sh){ tiles.push(d); total += Math.max(0, 4 - vis[d]); }
  }
  return { total, tiles };
}

// ================= 遊戲狀態 =================
const RESERVE = 16; // 台灣麻將留 16 張海底
const NAMES = ['你','阿福','小玉','老陳'];
const POS = ['你','下家','對家','上家'];
let G = null, V = null, gameToken = 0;
// 每個座位由誰操作：local＝這台電腦的玩家（永遠是座位 0）、remote＝連線玩家、ai＝電腦
const CTRL = ['local','ai','ai','ai'];
const isHuman = p => CTRL[p] !== 'ai';
const HOVER = [-1,-1,-1,-1];   // 每家正在摸哪一張手牌（對手出牌前的即時動態）
const REVEAL_MS = 1000;        // 吃、碰、槓之後先亮牌，停一下再出牌
// 連線狀態。單人遊玩時 NET.role 是 null，下面這些掛勾都不做事
const NET = { role:null, hid:0, ev(){}, dirty(){}, wait(){}, clear(){}, end(){} };
const HOST = { seats:[null,null,null,null], peerSeat:{}, keys:{}, seq:0, evq:[], timer:null, prompt:null, pid:0, deadline:0,

function visibleCounts(p){
  const v = new Array(34).fill(0);
  for (const t of G.players[p].hand) v[t]++;
  for (const P of G.players){ for (const t of P.discards) v[t]++; for (const m of P.melds) for (const t of m.tiles) v[t]++; }
  return v;
}
function threatOf(j){
  const P = G.players[j];
  let x = P.melds.filter(m => m.type !== 'ankan').length * 0.22 + Math.min(1, P.discards.length/16) * 0.45;
  if (P.tenpaiFlag) x += 0.35;
  return Math.min(1, x);
}
function maxThreatFor(p){ let level=0, j=-1; for (let k=0;k<4;k++){ if (k===p) continue; const v=threatOf(k); if (v>level){ level=v; j=k; } } return { level, j }; }
function dangerOf(p, t, vis){
  let worst = 0, safeAll = true;
  for (let j=0;j<4;j++){
    if (j === p) continue;
    const P = G.players[j]; let d;
    if (P.discards.includes(t)) d = 0;
    else {
      safeAll = false;
      if (t >= 27) d = vis[t] >= 3 ? 0.05 : vis[t] === 2 ? 0.25 : 0.55;
      else {
        const n = t%9, s = t-n;
        d = (n===0||n===8) ? 0.5 : (n===1||n===7) ? 0.7 : 1.0;
        const suji = (n-3 >= 0 && P.discards.includes(s+n-3)) || (n+3 <= 8 && P.discards.includes(s+n+3));
        if (suji) d *= 0.5;
        if (vis[t] >= 3) d *= 0.6;
      }
    }
    const w = d * threatOf(j); if (w > worst) worst = w;
  }
  return { d: worst, g: safeAll };
}
function analyzeHand(p){
  const P = G.players[p], c = counts(P.hand), mc = P.melds.length, vis = visibleCounts(p);
  const res = [], seen = new Set();
  for (const t of P.hand){
    if (seen.has(t)) continue; seen.add(t);
    c[t]--; const sh = calcShanten(c, mc); const u = ukeire(c, mc, sh, vis); c[t]++;
    const dg = dangerOf(p, t, vis);
    res.push({ t, sh, uk: u.total, tiles: u.tiles, danger: dg.d, genbutsu: dg.g });
  }
  return res;
}
const cmpBest = (a,b) => a.sh - b.sh || b.uk - a.uk || a.danger - b.danger;

function chiOptions(p, t){
  if (t >= 27) return [];
  const h = G.players[p].hand, n = t%9, out = [];
  if (n >= 2) out.push([t-2, t-1]);
  if (n >= 1 && n <= 7) out.push([t-1, t+1]);
  if (n <= 6) out.push([t+1, t+2]);
  return out.filter(o => h.includes(o[0]) && h.includes(o[1]));
}
function callGain(p, removeTiles){
  const P = G.players[p], c = counts(P.hand), before = calcShanten(c, P.melds.length);
  for (const r of removeTiles) c[r]--;
  let after = 99;
  for (let x=0;x<34;x++){ if (!c[x]) continue; c[x]--; const s = calcShanten(c, P.melds.length+1); c[x]++; if (s < after) after = s; }
  return { before, after };
}
function canWinWith(P, extra){ const c = counts(P.hand); if (extra != null) c[extra]++; return calcShanten(c, P.melds.length) === -1; }
function findKans(P){
  if (G.wall.length <= RESERVE) return [];
  const c = counts(P.hand), out = [];
  for (let t=0;t<34;t++) if (c[t] === 4) out.push({ type:'ankan', tile:t });
  for (const m of P.melds) if (m.type === 'pon' && c[m.tiles[0]] > 0) out.push({ type:'kakan', tile:m.tiles[0] });
  return out;
}

// ================= 流程 =================
function newGame(){
  gameToken++; NET.hid++;
  if (R.over){ Object.assign(R, { wind:0, dealer:0, startDealer:0, streak:0, over:false, needPick:true }); SCORES.fill(0); }
  if (V.onNewGame) V.onNewGame();
  if (R.needPick && V.pickDealer){
    // 一將開始前先「骰莊」：四家各擲骰子，點數最大的人當第一個莊（坐東）
    G = { wall:new Array(136).fill(0), players:[0,1,2,3].map(() => ({ hand:[], melds:[], discards:[] })), turn:-1, phase:'pick',
          last:null, lastDraw:null, dealOrder:[[],[],[],[]], deal:{ active:true, shown:[0,0,0,0], taken:new Set(), start:0 } };
    V.render(G);
    const tok = gameToken;
    return V.pickDealer(winner => {
      if (tok !== gameToken) return;
      R.dealer = R.startDealer = winner; R.needPick = false;
      if (V.onDealerPicked) V.onDealerPicked();
      dealHand();
    });
  }
  dealHand();
}
function dealHand(){
  const wall = []; for (let t=0;t<34;t++) for (let k=0;k<4;k++) wall.push(t); shuffle(wall);
  G = { wall, players: [0,1,2,3].map(() => ({ hand:[], melds:[], discards:[], tenpaiFlag:false, warned:false, meldWarned:false })),
        turn:0, phase:'deal', last:null, lastDraw:null, ctx:null, result:null, humanDiscards:0 };
  // 台灣麻將：每人輪流抓 4 張、抓 4 輪，共 16 張
  G.dealOrder = [[],[],[],[]];
  for (let r=0;r<4;r++) for (let q=0;q<4;q++) for (let k=0;k<4;k++){ const p = (R.dealer + q) % 4; const t = G.wall.pop(); G.players[p].hand.push(t); G.dealOrder[p].push(t); }
  G.players.forEach(P => sortHand(P.hand));
  G.deal = { active:true, shown:[0,0,0,0], taken:new Set(), start:0, dice:null };
  G.phase = 'intro';
  const tok = gameToken;
  const begin = () => { if (tok !== gameToken) return; G.deal.active = false; G.wk = { start:G.deal.start, F:64, B:0 }; startTurn(R.dealer, true, false); };
  const toDice = () => { if (tok !== gameToken) return; G.phase = 'dice'; V.render(G); V.diceAndDeal(begin); };
  const toShuffle = () => { if (tok !== gameToken) return; G.phase = 'shuffle'; V.render(G); if (V.shuffle) V.shuffle(toDice); else toDice(); };
  if (V.intro){ V.render(G); V.intro(toShuffle); }
  else begin();
}
// 骰子點數 → 從哪一家的牌牆開門（從莊家起逆時針數：1、5、9、13、17 是莊家自己）
function breakInfo(sum){
  const rel = (sum - 1) % 4, side = (R.dealer + rel) % 4;
  const start = ((side*17 + 16 - sum) % 68 + 68) % 68;   // 從那一家牌牆的右邊數 sum 墩，從下一墩開始抓
  return { rel, side, start };
}
const AUTODRAW = { hid:null };
function startTurn(p, draw, fromBack){
  G.turn = p; G.lastDraw = null; G.kanDraw = !!(draw && fromBack); HOVER[p] = -1;
  // 真人玩家自己從牌牆摸牌（點發亮的那張，或按「摸牌」）
  if (draw && G.wall.length > RESERVE && isHuman(p) && !(p === 0 && AUTODRAW.hid === NET.hid)){
    G.phase = 'draw'; G.drawBack = !!fromBack;
    const tok = gameToken; let done = false;
    const go = () => {
      if (done || tok !== gameToken || G.phase !== 'draw' || G.turn !== p) return;
      done = true; HOST.drawSeat = null; HOST.onDraw = null; NET.clear();
      if (p === 0) V.hideActions();
      drawAndPlay(p, true, fromBack);
    };
    V.render(G);
    if (p === 0){
      setBar([{ label:'摸牌', cls:'pon', fn: go }, { label:'自動摸牌', cls:'pass', fn: () => { AUTODRAW.hid = NET.hid; go(); } }],
        fromBack ? '槓完要從牌牆尾巴補一張：點發亮的牌，或按「摸牌」' : '輪到你摸牌：點發亮的牌，或按「摸牌」', ftip('draw', { back:fromBack }));
      grabFn = go;
      NET.wait('draw', [0], go);
    } else { HOST.drawSeat = p; HOST.drawBack = !!fromBack; HOST.onDraw = go; NET.wait('draw', [p], go); }
    return;
  }
  drawAndPlay(p, draw, fromBack);
}
function drawAndPlay(p, draw, fromBack){
  const P = G.players[p];
  if (draw){
    if (G.wall.length <= RESERVE){ if (V.sfx) V.sfx('ryuukyoku'); return endGame({ type:'draw' }); }
    if (G.wk){ if (fromBack) G.wk.B++; else G.wk.F++; }
    const t = fromBack ? G.wall.shift() : G.wall.pop();
    P.hand.push(t); sortHand(P.hand); G.lastDraw = t;
    if (V.sfx) V.sfx('draw', p);
  }
  G.phase = isHuman(p) ? 'human' : 'ai';
  if (isHuman(p)) G.turnOpts = turnOptsFor(p);
  V.render(G);
  if (p === 0) humanTurn();
  else if (isHuman(p)) NET.wait('turn', [p], () => aiTurn(p));   // 連線玩家：等他出牌，超過時間由電腦代打
  else later(() => aiThink(p), Math.round(DELAY.ai * 0.3));
}
function turnOptsFor(p){
  const P = G.players[p];
  return { tsumo: G.lastDraw !== null && canWinWith(P, null), kans: G.lastDraw !== null ? findKans(P) : [] };
}
function humanTurn(){
  const opts = G.turnOpts;
  V.showTurnActions(opts);
  NET.wait('turn', [0], () => { V.hideActions(); aiTurn(0); });
  if (opts.tsumo) say('peng', pick(['自摸！自摸啦！快按「自摸」！', '摸到了！這張自摸，快胡！']));
  else if (opts.kans.length) say('que', `你可以槓${tn(opts.kans[0].tile)}喔。槓了會多摸一張牌，但手牌也會少一點彈性。`);
}
function humanDiscard(t){
  if (NET.role === 'client') return NET.clientDiscard(t);
  if (!myTurn() || !G.players[0].hand.includes(t)) return;
  const A = analyzeHand(0);
  doDiscard(0, t);
  G.humanDiscards++;
  commentDiscard(A, t);
}
function doDiscard(p, t){
  NET.clear();
  const P = G.players[p];
  removeOne(P.hand, t); P.discards.push(t);
  if (V.sfx) V.sfx('discard', p);
  G.last = { tile:t, from:p }; G.lastDraw = null; G.phase = 'claims';
  if (p !== 0) P.tenpaiFlag = calcShanten(counts(P.hand), P.melds.length) === 0;
  V.hideActions(); V.render(G);
  if (p !== 0) aiTenpaiWarn(p);
  later(() => beginClaims(p, t), DELAY.claim);
}
function claimOptsFor(q, from, t){
  const P = G.players[q], c = counts(P.hand);
  return { ron: canWinWith(P, t), pon: c[t] >= 2, kan: c[t] === 3 && G.wall.length > RESERVE, chi: (from + 1) % 4 === q ? chiOptions(q, t) : [] };
}
const claimLevel = h => h.ron ? 3 : (h.pon || h.kan) ? 2 : h.chi.length ? 1 : 0;
function aiPonKan(p, t){
  const c = counts(G.players[p].hand);
  if (c[t] < 2) return null;
  if (t >= 31) return (c[t] === 3 && G.wall.length > RESERVE) ? 'kan' : 'pon';
  const g = callGain(p, [t,t]);
  return (g.after < g.before && Math.random() < 0.85) ? 'pon' : null;
}
function aiChi(p, t){
  for (const o of chiOptions(p, t)){ const g = callGain(p, o); if (g.after < g.before) return Math.random() < 0.6 ? o : null; }
  return null;
}
function beginClaims(from, t){
  const ctx = { from, tile:t, hum:{}, resp:{}, h:null, aiRon:null, aiPon:null, aiChi:null };
  for (let k=1;k<4;k++){
    const p = (from+k)%4; if (isHuman(p)) continue;
    if (ctx.aiRon === null && canWinWith(G.players[p], t)) ctx.aiRon = p;
    if (!ctx.aiPon){ const d = aiPonKan(p, t); if (d) ctx.aiPon = { p, kind:d }; }
  }
  const nx = (from+1)%4;
  if (!isHuman(nx)){ const s = aiChi(nx, t); if (s) ctx.aiChi = { p:nx, seq:s }; }
  // 只問「有機會贏過電腦」的真人：電腦要胡時，只能碰的人不用問
  const aiLevel = ctx.aiRon !== null ? 3 : ctx.aiPon ? 2 : ctx.aiChi ? 1 : 0;
  for (let k=1;k<4;k++){
    const q = (from+k)%4; if (!isHuman(q)) continue;
    const h = claimOptsFor(q, from, t), L = claimLevel(h);
    if (L > 0 && L >= aiLevel) ctx.hum[q] = h;
  }
  ctx.h = ctx.hum[0] || null;
  G.ctx = ctx;
  const seats = Object.keys(ctx.hum).map(Number);
  if (!seats.length) return finishClaims(ctx);
  G.phase = 'humanClaim';
  V.render(G);
  if (ctx.h){ V.showClaimActions(ctx.h); teacherOnClaimOption(ctx.h, ctx); }
  NET.wait('claim', seats, () => {
    for (const s of seats) if (!ctx.resp[s]) ctx.resp[s] = { action:'pass', seq:null };
    V.hideActions(); finishClaims(ctx);
  });
}
// 某位真人回答了（胡、碰、槓、吃或過）；全部的人都回答後才決定結果
function playerClaim(q, action, arg){
  if (!G || G.phase !== 'humanClaim' || !G.ctx) return;
  const ctx = G.ctx, h = ctx.hum[q];
  if (!h || ctx.resp[q]) return;
  let a = action, seq = null;
  if (a === 'chi'){ seq = Array.isArray(arg) ? h.chi.find(o => o[0] === arg[0] && o[1] === arg[1]) || null : null; if (!seq) a = 'pass'; }
  else if (!((a === 'ron' && h.ron) || (a === 'pon' && h.pon) || (a === 'kan' && h.kan))) a = 'pass';
  ctx.resp[q] = { action:a, seq };
  if (Object.keys(ctx.hum).every(s => ctx.resp[s])) finishClaims(ctx);
  else NET.dirty();
}
// 優先順序：胡 ＞ 碰、槓 ＞ 吃；同樣要胡時，離打牌的人最近的下家優先
function finishClaims(ctx){
  NET.clear();
  G.phase = 'claims';
  const order = [1,2,3].map(k => (ctx.from + k) % 4);
  for (const p of order){ const r = ctx.resp[p]; if ((r && r.action === 'ron') || p === ctx.aiRon) return winBy(p, 'ron', ctx); }
  for (const p of order){
    const r = ctx.resp[p];
    if (r && (r.action === 'pon' || r.action === 'kan')) return applyPon(p, ctx, r.action);
    if (ctx.aiPon && ctx.aiPon.p === p) return applyPon(p, ctx, ctx.aiPon.kind);
  }
  const nx = order[0], r = ctx.resp[nx];
  if (r && r.action === 'chi') return applyChi(nx, ctx, r.seq);
  if (ctx.aiChi) return applyChi(ctx.aiChi.p, ctx, ctx.aiChi.seq);
  startTurn(nx, true, false);
}
function humanClaim(action, arg){
  if (!G || G.phase !== 'humanClaim' || !G.ctx || !G.ctx.h) return;
  const ctx = G.ctx; V.hideActions();
  if (action === 'pon' || action === 'kan') say('peng', `${action==='kan'?'槓':'碰'}得漂亮！${action==='kan'?'補一張牌後再打出一張':'現在打一張牌出去'}。`);
  else if (action === 'chi') say('peng', `吃${seqName([...arg, ctx.tile])}！手腳變快了，現在打一張出去。`);
  else if (action === 'pass') teacherOnPass(ctx);
  if (NET.role === 'client') return NET.clientClaim(action, arg);
  playerClaim(0, action, arg);
}
function applyPon(p, ctx, kind){
  const P = G.players[p], t = ctx.tile;
  removeN(P.hand, t, kind === 'kan' ? 3 : 2);
  G.players[ctx.from].discards.pop();
  P.melds.push({ type:kind, tiles:new Array(kind==='kan'?4:3).fill(t), from:ctx.from });
  G.last = null;
  V.announce(p, kind === 'kan' ? '槓' : '碰');
  if (p !== 0) commentAiCall(p, kind, t);
  revealThen(p, () => startTurn(p, kind === 'kan', kind === 'kan'));
}
// 吃碰槓之後：先把牌亮在桌上，停一下，再輪到他出牌
function revealThen(p, fn){
  G.turn = p; G.phase = 'reveal';
  V.render(G);
  const tok = gameToken;
  later(() => { if (tok === gameToken) fn(); }, REVEAL_MS);
}
function applyChi(p, ctx, seq){
  const P = G.players[p], t = ctx.tile;
  seq.forEach(x => removeOne(P.hand, x));
  G.players[ctx.from].discards.pop();
  P.melds.push({ type:'chi', tiles:[...seq, t].sort((a,b)=>a-b), from:ctx.from });
  G.last = null;
  V.announce(p, '吃');
  if (p !== 0) commentAiCall(p, 'chi', t);
  revealThen(p, () => startTurn(p, false, false));
}
function selfKan(p, k){
  NET.clear();
  const P = G.players[p];
  if (k.type === 'ankan'){ removeN(P.hand, k.tile, 4); P.melds.push({ type:'ankan', tiles:[k.tile,k.tile,k.tile,k.tile] }); }
  else { removeOne(P.hand, k.tile); const m = P.melds.find(m => m.type==='pon' && m.tiles[0]===k.tile); m.type = 'kan'; m.tiles.push(k.tile); }
  V.announce(p, '槓');
  revealThen(p, () => startTurn(p, true, true));
}
function humanSelfKan(k){
  if (NET.role === 'client') return NET.clientKan(k);
  if (myTurn()){ V.hideActions(); selfKan(0, k); }
}
function humanTsumo(){
  if (NET.role === 'client') return NET.clientTsumo();
  if (myTurn() && G.turnOpts && G.turnOpts.tsumo) winBy(0, 'tsumo');
}

function aiChooseDiscard(p){
  const A = analyzeHand(p);
  const minSh = Math.min(...A.map(a => a.sh));
  const defensive = maxThreatFor(p).level >= 0.65 && minSh >= 2;
  let best = null, bs = Infinity;
  for (const a of A){
    let s = a.sh*1000 - a.uk + a.danger*(defensive ? 3000 : 8);
    if (a.t >= 27) s -= 0.5;
    if (s < bs){ bs = s; best = a; }
  }
  return best.t;
}
function setHover(p, i){ if (HOVER[p] === i) return; HOVER[p] = i; NET.dirty(); }
function aiThink(p){
  const P = G.players[p], tok = gameToken;
  if (G.phase !== 'ai' || G.turn !== p) return;
  if (G.lastDraw !== null && (canWinWith(P, null) || findKans(P).length)) return later(() => aiTurn(p), Math.round(DELAY.ai * 0.7));
  const target = P.hand.indexOf(aiChooseDiscard(p)), n = P.hand.length, path = [];
  const k = 1 + Math.floor(Math.random() * 2);
  for (let i=0;i<k;i++) path.push(Math.floor(Math.random() * n));
  path.push(target);
  const step = Math.max(30, Math.round(DELAY.ai * 0.7 / path.length));
  let i = 0;
  const go = () => {
    if (tok !== gameToken || G.turn !== p || G.phase !== 'ai') return;
    if (i < path.length){ setHover(p, path[i++]); return later(go, step); }
    setHover(p, -1); aiTurn(p);
  };
  go();
}
function aiTurn(p){
  const P = G.players[p];
  if (G.lastDraw !== null && canWinWith(P, null)) return winBy(p, 'tsumo');
  if (G.lastDraw !== null){ const k = findKans(P); if (k.length) return selfKan(p, k[0]); }
  doDiscard(p, aiChooseDiscard(p));
}
// ================= 台數計算（台灣 16 張常見規則，無花牌） =================
const BASE = 100, PER_TAI = 20;
const SCORES = [0,0,0,0];
// 圈與莊：wind 0~3 = 東南西北風圈；dealer = 現在誰當莊；streak = 連莊次數
const R = { wind:0, dealer:0, startDealer:0, streak:0, over:false, needPick:true };
const seatWind = p => 27 + (p - R.dealer + 4) % 4;      // 莊家坐東，逆時針依序南西北
const roundWind = () => 27 + R.wind;
const handName = () => `${HONOR[R.wind]}風${HONOR[(R.dealer - R.startDealer + 4) % 4]}`;   // 例：東風東、東風南…北風北
function advanceRound(res){
  // 莊家胡牌或流局 → 連莊；其他人胡 → 下一家當莊，四家輪完換下一個風圈
  const keep = res.type === 'draw' || res.winner === R.dealer;
  if (keep){ R.streak++; return { keep:true, over:false }; }
  R.streak = 0; R.dealer = (R.dealer + 1) % 4;
  if (R.dealer === R.startDealer){ R.wind++; if (R.wind === 4){ R.over = true; return { keep:false, over:true }; } }

    faceMats[t] = new THREE.MeshStandardMaterial({ map:tex, roughness:0.35 });
    faceHi[t] = new THREE.MeshStandardMaterial({ map:tex, roughness:0.35, emissive:0x8a6400, emissiveIntensity:0.5 });
    faceLast[t] = new THREE.MeshStandardMaterial({ map:tex, roughness:0.35, emissive:0x9a2020, emissiveIntensity:0.32 });
  }
}
// ---- 圓角倒角的牌身：前段象牙色、後段是貼皮 ----
function roundedRect(w, h, r){
  const s = new THREE.Shape(), x = -w/2, y = -h/2;
  s.moveTo(x+r, y); s.lineTo(x+w-r, y); s.quadraticCurveTo(x+w, y, x+w, y+r);
  s.lineTo(x+w, y+h-r); s.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  s.lineTo(x+r, y+h); s.quadraticCurveTo(x, y+h, x, y+h-r);
  s.lineTo(x, y+r); s.quadraticCurveTo(x, y, x+r, y);
  return s;
}
function slab(thick, zStart){
  const b = 0.055;
  const g = new THREE.ExtrudeGeometry(roundedRect(TW - 2*b, TH - 2*b, 0.06), {
    depth: thick - 2*b, bevelEnabled:true, bevelThickness:b, bevelSize:b, bevelSegments:4, curveSegments:6 });
  g.translate(0, 0, zStart + b);
  return g;
}
function buildGeometry(){
  const backT = 0.3;
  geoBack = slab(backT, -TD/2);
  geoFront = slab(TD - backT, -TD/2 + backT);
  const fw = TW - 0.12, fh = TH - 0.12;
  geoFace = new THREE.ShapeGeometry(roundedRect(fw, fh, 0.07), 6);
  const pos = geoFace.attributes.position, uv = geoFace.attributes.uv;
  for (let i=0;i<pos.count;i++) uv.setXY(i, (pos.getX(i) + fw/2)/fw, (pos.getY(i) + fh/2)/fh);
  uv.needsUpdate = true;
  geoFace.translate(0, 0, TD/2 + 0.003);
}
function tileMesh(t, mode){
  const g = new THREE.Group();
  const front = new THREE.Mesh(geoFront, sideMat), back = new THREE.Mesh(geoBack, backMat);
  front.castShadow = back.castShadow = true;
  g.add(front, back);
  if (mode !== 'hidden'){
    const f = mode === 'hi' ? faceHi[t] : mode === 'last' ? faceLast[t] : faceMats[t];
    g.add(new THREE.Mesh(geoFace, f));
  }
  return g;
}
function flatTile(grp, t, x, z, mode){
  const m = tileMesh(t, mode);
  m.rotation.x = mode === 'hidden' ? Math.PI/2 : -Math.PI/2;   // 蓋牌時背面朝上
  m.position.set(x, TD/2, z); grp.add(m); return m;
}
function standTile(grp, t, x, z, mode, tilt){ const m = tileMesh(t, mode); m.rotation.x = tilt || 0; m.position.set(x, TH/2, z); grp.add(m); return m; }

const SKIN_IMG = {};   // 已經載入的插畫
function skinImage(sk, cb){
  let im = SKIN_IMG[sk.name];
  if (im && im.complete && im.naturalWidth){ cb(im); return im; }
  if (!im){ im = new Image(); im.src = sk.img; SKIN_IMG[sk.name] = im; }
  im.addEventListener('load', () => cb(im), { once:true });
  return null;
}
const PATTERNS = ['solid','waves','dots','check','diamond','stripes','sakura','clouds','hex','coins'];
const PATTERN_NAMES = { solid:'素面', waves:'青海波', dots:'圓點', check:'格紋', diamond:'菱格', stripes:'斜紋', sakura:'櫻花', clouds:'祥雲', hex:'龜甲', coins:'古錢' };
let skinTex = null, currentSkin = null;
function drawSkin(g, S, sk){
  g.fillStyle = sk.color; g.fillRect(0,0,S,S);
  if (sk.img){
    const draw = im => { const cw = g.canvas.width, ch = g.canvas.height; g.drawImage(im, 0, 0, cw, ch); };
    if (!skinImage(sk, im => draw(im))) return;
    draw(SKIN_IMG[sk.name]); return;
  }
  const a = sk.accent || 'rgba(255,255,255,.3)';
  g.strokeStyle = a; g.fillStyle = a; g.lineWidth = S/32;
  if (sk.pattern === 'solid'){
    const gr = g.createRadialGradient(S*.3,S*.3,0,S*.3,S*.3,S*.9); gr.addColorStop(0,'rgba(255,255,255,.18)'); gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0,0,S,S);
  } else if (sk.pattern === 'stripes'){
    g.lineWidth = S/18;
    for (let i=-S;i<=2*S;i+=S/6){ g.beginPath(); g.moveTo(i,0); g.lineTo(i+S,S); g.stroke(); }
  } else if (sk.pattern === 'dots'){
    const sp = S/4;
    for (let r=-1;r<=4;r++) for (let c=-1;c<=4;c++){ g.beginPath(); g.arc(c*sp + (r%2 ? sp/2 : 0), r*sp, S/16, 0, Math.PI*2); g.fill(); }
  } else if (sk.pattern === 'check'){
    g.globalAlpha = 0.55;
    for (let i=0;i<S;i+=S/4){ g.fillRect(i, 0, S/8, S); g.fillRect(0, i, S, S/8); }
    g.globalAlpha = 1;
  } else if (sk.pattern === 'diamond'){
    for (let i=-S;i<=2*S;i+=S/4){ g.beginPath(); g.moveTo(i,0); g.lineTo(i+S,S); g.stroke(); g.beginPath(); g.moveTo(i,S); g.lineTo(i+S,0); g.stroke(); }
  } else if (sk.pattern === 'waves'){
    const R = S/8;
    for (let row=-1; row<=8; row++) for (let c=-1; c<=5; c++){
      const cx = c*2*R + (row%2 ? R : 0), cy = row*R*0.9;
      g.fillStyle = sk.color; g.beginPath(); g.arc(cx, cy, R, Math.PI, 0); g.fill();
      for (let k=1;k<=3;k++){ g.beginPath(); g.arc(cx, cy, R*k/3.2, Math.PI, 0); g.stroke(); }
    }
  } else if (sk.pattern === 'sakura'){
    const sp = S/3;
    for (let r=-1;r<=3;r++) for (let c=-1;c<=3;c++){
      const cx = c*sp + (r%2 ? sp/2 : 0) + sp/4, cy = r*sp + sp/3, R = S/14;
      g.save(); g.translate(cx, cy); g.rotate((r*3 + c)*0.7);
      for (let k=0;k<5;k++){ g.rotate(Math.PI*2/5); g.beginPath(); g.ellipse(0, -R, R*0.55, R, 0, 0, Math.PI*2); g.fill(); }
      g.fillStyle = sk.color; g.beginPath(); g.arc(0,0,R*0.3,0,Math.PI*2); g.fill(); g.fillStyle = a;
      g.restore();
    }
  } else if (sk.pattern === 'clouds'){
    g.lineWidth = S/40;
    const sp = S/2;
    for (let r=-1;r<=2;r++) for (let c=-1;c<=2;c++){
      const cx = c*sp + (r%2 ? sp/2 : 0) + sp/2, cy = r*sp + sp/2, R = S/12;
      g.beginPath(); g.arc(cx - R, cy, R, Math.PI*0.5, Math.PI*1.9); g.arc(cx + R*0.4, cy - R*0.5, R*1.1, Math.PI*1.1, Math.PI*0.1); g.arc(cx + R*1.5, cy + R*0.2, R*0.8, Math.PI*1.4, Math.PI*0.6); g.stroke();
      g.beginPath(); g.arc(cx - R, cy, R*0.45, Math.PI*0.5, Math.PI*1.9); g.stroke();
    }
  } else if (sk.pattern === 'hex'){
    g.lineWidth = S/48;
    const R = S/8, w = R*Math.sqrt(3);
    for (let r=-1;r<=6;r++) for (let c=-1;c<=5;c++){
      const cx = c*w + (r%2 ? w/2 : 0), cy = r*R*1.5;
      g.beginPath(); for (let k=0;k<6;k++){ const an = Math.PI/6 + k*Math.PI/3; const x = cx + R*0.86*Math.cos(an), y = cy + R*0.86*Math.sin(an); k ? g.lineTo(x,y) : g.moveTo(x,y); } g.closePath(); g.stroke();
    }
  } else if (sk.pattern === 'coins'){
    g.lineWidth = S/40;
    const sp = S/3, R = S/9;
    for (let r=-1;r<=3;r++) for (let c=-1;c<=3;c++){
      const cx = c*sp + (r%2 ? sp/2 : 0) + sp/2, cy = r*sp + sp/2;
      g.beginPath(); g.arc(cx, cy, R, 0, Math.PI*2); g.stroke();
      g.fillRect(cx - R*0.32, cy - R*0.32, R*0.64, R*0.64);
      g.fillStyle = sk.color; g.fillRect(cx - R*0.18, cy - R*0.18, R*0.36, R*0.36); g.fillStyle = a;
    }
  }
}
function randomSkin(){
  const h = Math.floor(Math.random()*360), s = 40 + Math.floor(Math.random()*30), l = 30 + Math.floor(Math.random()*18);
  const pattern = pick(PATTERNS.slice(1));
  const accent = Math.random() < 0.35 ? `hsl(${(h+150)%360},70%,72%)` : null;
  return { name:'隨機・' + PATTERN_NAMES[pattern], color:`hsl(${h},${s}%,${l}%)`, pattern, accent, random:true };
}
function applySkin(sk, save){
  currentSkin = sk;
  if (sk.img){
    skinImage(sk, im => {
      if (currentSkin !== sk) return;
      const tex = new THREE.Texture(im); tex.anisotropy = 4;
      tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
      // 牌背的座標是 -TW/2…TW/2、-TH/2…TH/2；從背面看左右是相反的，所以水平翻轉
      tex.repeat.set(-1/TW, 1/TH); tex.offset.set(0.5, 0.5);
      tex.needsUpdate = true;
      if (skinTex) skinTex.dispose();
      skinTex = tex; backMat.map = skinTex; backMat.needsUpdate = true;
    });
  } else {
    const cv = document.createElement('canvas'); cv.width = cv.height = 256;
    drawSkin(cv.getContext('2d'), 256, sk);
    if (skinTex) skinTex.dispose();
    skinTex = canvasTex(cv); skinTex.wrapS = skinTex.wrapT = THREE.RepeatWrapping; skinTex.repeat.set(1.6, 1.6);
    backMat.map = skinTex; backMat.needsUpdate = true;
  }
  document.documentElement.style.setProperty('--tile-back', sk.color);
  if (save) try { localStorage.setItem('hm-skin', JSON.stringify(sk.img ? { name:sk.name } : sk)); } catch (e) {}
  renderSkinPanel();
}
function renderSkinPanel(){
  const wrap = document.getElementById('swatches'); if (!wrap) return;
  wrap.innerHTML = '';
  const list = SKINS;
  list.forEach(sk => {
    const b = document.createElement('button'); b.className = 'swatch'; b.type = 'button';
    const on = currentSkin && currentSkin.name === sk.name;
    b.setAttribute('aria-pressed', on);
    const cv = document.createElement('canvas'); cv.width = 72; cv.height = 96;
    const g = cv.getContext('2d'); drawSkin(g, 96, sk);
    const lab = document.createElement('span'); lab.textContent = sk.name;
    b.append(cv, lab); b.addEventListener('click', () => applySkin(sk, true));
    wrap.appendChild(b);
  });
}

// 名牌：兩行（位置＋門風／名字），浮在桌子外面、對著鏡頭
function makeLabel(p, active){
  const cv = document.createElement('canvas'); cv.width = 480; cv.height = 210; const g = cv.getContext('2d');

const PANO_R = 200, PANO_DROP_DEG = 14;   // 地平線落在鏡頭下方約 14 度，畫面上緣看得到天際線
let pano = null, sceneIdx = 0, sceneTok = 0;
function buildPano(){
  pano = new THREE.Group(); scene.add(pano);
  let saved = 0; try { saved = Math.max(0, SCENES.findIndex(x => x.id === localStorage.getItem('hm-scene'))); } catch (e) {}
  applyScene(saved, false);
}
function applyScene(i, save){
  const cfg = SCENES[i], tok = ++sceneTok; sceneIdx = i;
  if (save) try { localStorage.setItem('hm-scene', cfg.id); } catch (e) {}
  renderScenePanel();
  const img = new Image();
  img.onload = () => {
    if (tok !== sceneTok) return;
    let source = img, w = img.width, h = img.height;
    if (cfg.mirror){
      const cv = document.createElement('canvas'); cv.width = w*2; cv.height = h; const g = cv.getContext('2d');
      g.drawImage(img, 0, 0); g.save(); g.scale(-1, 1); g.drawImage(img, -w*2, 0); g.restore();
      source = cv; w *= 2;
    }
    const tex = new THREE.Texture(source); tex.needsUpdate = true;
    tex.wrapS = THREE.RepeatWrapping; tex.repeat.x = -1; tex.anisotropy = 8;   // 從內側看，水平翻轉回正確方向
    while (pano.children.length){ const c = pano.children.pop(); c.geometry.dispose(); if (c.material.map) c.material.map.dispose(); c.material.dispose(); }
    scene.background = new THREE.Color(cfg.bg);
    const mat = new THREE.MeshBasicMaterial({ map:tex, side:THREE.BackSide, color:0xeaeaea });
    if (cfg.type === 'sphere') pano.add(new THREE.Mesh(new THREE.SphereGeometry(PANO_R, 96, 48), mat));
    else {
      const H = 2*Math.PI*PANO_R*h/w;
      const wall = new THREE.Mesh(new THREE.CylinderGeometry(PANO_R, PANO_R, H, 128, 1, true), mat);
      wall.position.y = H*(cfg.horizon - 0.5);   // 讓照片裡的海平線對齊 y = 0
      const ground = new THREE.Mesh(new THREE.CircleGeometry(PANO_R + 2, 96), new THREE.MeshBasicMaterial({ color:cfg.ground }));
      ground.rotation.x = -Math.PI/2; ground.position.y = wall.position.y - H/2 + 0.3;
      pano.add(wall, ground);
    }
    pano.rotation.y = cfg.face;
  };
  img.src = cfg.src;
}
function placePano(){
  if (!pano) return;
  pano.position.set(0, camera.position.y - Math.tan(PANO_DROP_DEG*Math.PI/180)*PANO_R, 0);
}
function renderScenePanel(){
  const wrap = document.getElementById('sceneList'); if (!wrap) return;
  wrap.innerHTML = '';
  SCENES.forEach((sc, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'scene';
    b.setAttribute('aria-pressed', i === sceneIdx);
    b.textContent = sc.name; b.addEventListener('click', () => {
      applyScene(i, true);
      const ti = TABLES.findIndex(t => t.id === sc.table); if (ti >= 0) applyTable(ti, true);
    });
    wrap.appendChild(b);
  });
}

// ---- 可換的牌桌：桌布材質＋桌框材質（全部用程式畫） ----
const TABLES = [
  { id:'classic', name:'經典綠絨・深木框', felt:'#1e5c47', feltKind:'velvet', rim:'#5a3520', rimKind:'wood', trim:null },
  { id:'wine', name:'酒紅絨・淺木框', felt:'#6b1d29', feltKind:'velvet', rim:'#a8784a', rimKind:'wood', trim:null },
  { id:'navy', name:'深藍絨・黑漆金邊', felt:'#1c2d52', feltKind:'velvet', rim:'#141414', rimKind:'lacquer', trim:'#c9a24a' },
  { id:'marble', name:'湖水綠絨・白大理石', felt:'#1d6a72', feltKind:'velvet', rim:'#ecebe6', rimKind:'marble', trim:'#c9a24a' },
  { id:'leather', name:'黑皮革・胡桃木框', felt:'#262626', feltKind:'leather', rim:'#4a2e1d', rimKind:'wood', trim:'#8a8a8a' },
  { id:'bamboo', name:'亞麻布・竹框', felt:'#8f7a55', feltKind:'linen', rim:'#c9a861', rimKind:'bamboo', trim:null }
];
let feltMat, rimMatH, rimMatV, trimMat, tableIdx = 0;
const trimMeshes = [];
const hexRGB = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
function shade(h, k){ const [r,g,b] = hexRGB(h); const f = v => Math.max(0, Math.min(255, Math.round(v*k))); return `rgb(${f(r)},${f(g)},${f(b)})`; }
function feltTexture(t){
  const S = 512, cv = document.createElement('canvas'); cv.width = cv.height = S; const g = cv.getContext('2d');
  g.fillStyle = t.felt; g.fillRect(0,0,S,S);
  const img = g.getImageData(0,0,S,S), d = img.data, amp = t.feltKind === 'leather' ? 14 : t.feltKind === 'linen' ? 10 : 7;
  for (let i=0;i<d.length;i+=4){ const n = (Math.random()-.5)*amp*2; d[i]+=n; d[i+1]+=n; d[i+2]+=n; }
  g.putImageData(img,0,0);
  if (t.feltKind === 'leather'){
    for (let k=0;k<2600;k++){ g.fillStyle = `rgba(0,0,0,${0.05+Math.random()*0.08})`; g.beginPath(); g.ellipse(Math.random()*S, Math.random()*S, 2+Math.random()*5, 1+Math.random()*3, Math.random()*3, 0, Math.PI*2); g.fill(); }
  } else if (t.feltKind === 'linen'){
    g.lineWidth = 1;
    for (let y=0;y<S;y+=3){ g.strokeStyle = `rgba(0,0,0,${0.04+Math.random()*0.06})`; g.beginPath(); g.moveTo(0,y); g.lineTo(S,y); g.stroke(); }
    for (let x=0;x<S;x+=3){ g.strokeStyle = `rgba(255,255,255,${0.03+Math.random()*0.05})`; g.beginPath(); g.moveTo(x,0); g.lineTo(x,S); g.stroke(); }
  }
  // 中間稍亮、四周稍暗，像燈打在桌上
  const v = g.createRadialGradient(S/2,S/2,S*0.15,S/2,S/2,S*0.75); v.addColorStop(0,'rgba(255,255,255,.07)'); v.addColorStop(1,'rgba(0,0,0,.28)');
  g.fillStyle = v; g.fillRect(0,0,S,S);
  const tex = canvasTex(cv); return tex;
}
function rimTexture(t, vertical){
  const L = 1024, W = 96, cv = document.createElement('canvas');
  cv.width = vertical ? W : L; cv.height = vertical ? L : W; const g = cv.getContext('2d');
  if (vertical){ g.translate(W, 0); g.rotate(Math.PI/2); }
  g.fillStyle = t.rim; g.fillRect(0,0,L,W);
  if (t.rimKind === 'wood'){
    for (let k=0;k<70;k++){
      const y = Math.random()*W; g.strokeStyle = Math.random() < .5 ? shade(t.rim, .7) : shade(t.rim, 1.18); g.globalAlpha = .25 + Math.random()*.35; g.lineWidth = .6 + Math.random()*1.8;
      g.beginPath(); g.moveTo(0, y); for (let x=0;x<=L;x+=32) g.lineTo(x, y + Math.sin(x/90 + k)*2.2); g.stroke();
    }
    g.globalAlpha = 1;
  } else if (t.rimKind === 'marble'){
    for (let k=0;k<14;k++){
      g.strokeStyle = `rgba(110,110,115,${.15 + Math.random()*.3})`; g.lineWidth = .5 + Math.random()*1.8;
      let x = Math.random()*L, y = Math.random()*W; g.beginPath(); g.moveTo(x, y);
      for (let j=0;j<8;j++){ x += 20 + Math.random()*60; y += (Math.random()-.5)*40; g.lineTo(x, y); } g.stroke();
    }
  } else if (t.rimKind === 'bamboo'){
    for (let x=0;x<L;x+=128){ g.fillStyle = shade(t.rim, .72); g.fillRect(x, 0, 5, W); g.fillStyle = shade(t.rim, 1.15); g.fillRect(x+5, 0, 3, W); }
    for (let k=0;k<30;k++){ g.strokeStyle = `rgba(0,0,0,${.05+Math.random()*.08})`; const y = Math.random()*W; g.beginPath(); g.moveTo(0,y); g.lineTo(L,y); g.stroke(); }
  } else {
    const gr = g.createLinearGradient(0,0,0,W); gr.addColorStop(0,'rgba(255,255,255,.18)'); gr.addColorStop(.5,'rgba(255,255,255,0)'); gr.addColorStop(1,'rgba(0,0,0,.2)');
    g.fillStyle = gr; g.fillRect(0,0,L,W);
  }

}
function applyTable(i, save){
  const t = TABLES[i]; tableIdx = i;
  if (save) try { localStorage.setItem('hm-table', t.id); } catch (e) {}
  [feltMat, rimMatH, rimMatV].forEach(m => { if (m.map) m.map.dispose(); });
  feltMat.map = feltTexture(t); feltMat.roughness = t.feltKind === 'leather' ? 0.6 : 0.95; feltMat.needsUpdate = true;
  rimMatH.map = rimTexture(t, false); rimMatV.map = rimTexture(t, true);
  const gloss = t.rimKind === 'lacquer' ? 0.18 : t.rimKind === 'marble' ? 0.25 : 0.55;
  [rimMatH, rimMatV].forEach(m => { m.roughness = gloss; m.needsUpdate = true; });
  trimMeshes.forEach(m => m.visible = !!t.trim);

  renderTablePanel();
}
function renderTablePanel(){
  const wrap = document.getElementById('tableList'); if (!wrap) return;

// ---- 牌牆：每家面前 17 墩、每墩 2 張 ----
const WALL_S = 0.62, WALL_R = 7.6;
// 打牌時的牌牆：每張牌的位置 = 墩號×2 + 層（1 上層、0 下層）。前面從開門處往順時針摸，槓牌從尾巴補
function wallView(wk, map){
  const taken = new Set(), m = x => map(((x % 68) + 68) % 68);
  const front = k => m(wk.start - Math.floor(k / 2)) * 2 + (k % 2 === 0 ? 1 : 0);
  const back = j => m(wk.start + 1 + Math.floor(j / 2)) * 2 + (j % 2 === 0 ? 1 : 0);
  for (let k=0;k<wk.F;k++) taken.add(front(k));
  for (let j=0;j<wk.B;j++) taken.add(back(j));
  return { taken, front:front(wk.F), back:back(wk.B) };
}
function drawPlayWall(grp, p, wv, glow){
  const wg = new THREE.Group(); wg.scale.setScalar(WALL_S); grp.add(wg);
  for (let j=0;j<17;j++){
    const st = p*17 + j, x = (-8 + j)*STEP, z = WALL_R / WALL_S;
    for (let l=0;l<2;l++){
      const slot = st*2 + l; if (wv.taken.has(slot)) continue;
      const m = flatTile(wg, 0, x, z, 'hidden'); m.castShadow = false; m.position.y += l*TD;
      if (slot === glow){ m.children.forEach(c => { c.material = glowMat; }); wallPick.push(m); m.position.y += 0.18; }
    }
  }
}
function drawWall(grp, p, taken, next){
  const wg = new THREE.Group(); wg.scale.setScalar(WALL_S); grp.add(wg);
  for (let j=0;j<17;j++){
    if (taken.has(p*17 + j)) continue;
    const x = (-8 + j)*STEP, z = WALL_R / WALL_S;
    const glow = next && next.includes(p*17 + j);
    const lo = flatTile(wg, 0, x, z, 'hidden'); const hi = flatTile(wg, 0, x, z, 'hidden'); hi.position.y += TD;
    lo.castShadow = hi.castShadow = false;
    if (glow){
      [lo, hi].forEach(m => { m.children.forEach(c => { c.material = glowMat; }); wallPick.push(m); });
      lo.position.y += 0.12; hi.position.y += 0.12;
    }
  }
}

// ---- 3D 骰子 ----
const DIE = 0.9;
let diceMats = null, diceMeshes = [];
const tickers = [];
function pipFace(n){
  const cv = document.createElement('canvas'); cv.width = cv.height = 128; const g = cv.getContext('2d');
  g.fillStyle = '#fbf7ee'; g.fillRect(0,0,128,128);
  const P = {1:[[64,64]],2:[[40,40],[88,88]],3:[[38,38],[64,64],[90,90]],4:[[40,40],[88,40],[40,88],[88,88]],
    5:[[40,40],[88,40],[64,64],[40,88],[88,88]],6:[[42,36],[86,36],[42,64],[86,64],[42,92],[86,92]]}[n];
  g.fillStyle = (n === 1 || n === 4) ? '#c62f2b' : '#1b1b1b';   // 中式骰子：一點和四點是紅色
  P.forEach(([x,y]) => { g.beginPath(); g.arc(x, y, n === 1 ? 22 : 11, 0, Math.PI*2); g.fill(); });
  return new THREE.MeshStandardMaterial({ map: canvasTex(cv), roughness:0.3 });
}
// BoxGeometry 面的順序：+x, -x, +y, -y, +z, -z
const DIE_FACES = [3, 4, 1, 6, 2, 5];
function faceUpQuat(v){
  const q = new THREE.Quaternion(), X = new THREE.Vector3(1,0,0), Z = new THREE.Vector3(0,0,1);
  if (v === 6) q.setFromAxisAngle(X, Math.PI);
  else if (v === 2) q.setFromAxisAngle(X, -Math.PI/2);
  else if (v === 5) q.setFromAxisAngle(X, Math.PI/2);
  else if (v === 3) q.setFromAxisAngle(Z, Math.PI/2);
  else if (v === 4) q.setFromAxisAngle(Z, -Math.PI/2);
  const yaw = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), Math.random()*Math.PI*2);
  return yaw.multiply(q);
}
// 圓角骰子：把方塊的頂點往內縮，再沿法線推出一個圓角半徑
let _dieGeo = null;
function roundedDieGeo(){
  if (_dieGeo) return _dieGeo;
  const g = new THREE.BoxGeometry(DIE, DIE, DIE, 10, 10, 10), pos = g.attributes.position;
  const h = DIE/2, r = DIE*0.16, v = new THREE.Vector3(), inner = new THREE.Vector3();
  for (let i=0;i<pos.count;i++){
    v.fromBufferAttribute(pos, i);
    inner.set(Math.max(-h+r, Math.min(h-r, v.x)), Math.max(-h+r, Math.min(h-r, v.y)), Math.max(-h+r, Math.min(h-r, v.z)));
    v.sub(inner); if (v.lengthSq() > 0) v.normalize().multiplyScalar(r); v.add(inner);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return (_dieGeo = g);
}
function clearDice(){ diceMeshes.forEach(m => scene.remove(m)); diceMeshes = []; }
function rollDice(values, done, seat){
  if (!diceMats) diceMats = DIE_FACES.map(pipFace);
  clearDice();
  const geo = roundedDieGeo();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dur = reduce ? 0.4 : 1.6, t0 = performance.now();
  diceRattle(dur);
  const dice = values.map((v, i) => {
    const m = new THREE.Mesh(geo, diceMats); m.castShadow = true; scene.add(m); diceMeshes.push(m);
    const end = new THREE.Vector3(-1.3 + i*1.3 + (Math.random()-.5)*0.4, DIE/2, 0.6 + (Math.random()-.5)*0.8);
    // 從擲骰的人那一邊丟出來：0 自己（前面）、1 右邊、2 對面、3 左邊
    const sp = seat | 0, side = (Math.random() - .5) * 2.5, far = 6 + Math.random() * 1.5;
    const off = [[side, far], [far, side], [side, -far], [-far, side]][((sp % 4) + 4) % 4];
    const startP = new THREE.Vector3(end.x + off[0], 4 + Math.random(), end.z + off[1]);
    const axis = new THREE.Vector3(Math.random()-.5, Math.random()-.5, Math.random()-.5).normalize();
    return { m, end, startP, axis, spin: 14 + Math.random()*8, target: faceUpQuat(v), bounced: 0 };
  });
  const tick = now => {
    const k = Math.min(1, (now - t0) / 1000 / dur);
    for (const d of dice){
      const e = 1 - Math.pow(1 - k, 2.2);
      d.m.position.lerpVectors(d.startP, d.end, e);
      // 落地彈跳
      const hop = Math.abs(Math.sin(e * Math.PI * 3)) * (1 - e) * 2.2;
      d.m.position.y = d.end.y + hop;
      const free = new THREE.Quaternion().setFromAxisAngle(d.axis, d.spin * (1 - e) * (1 - e));
      d.m.quaternion.copy(d.target).multiply(free);
    }
    if (k >= 1){ tickers.splice(tickers.indexOf(tick), 1); done(); }
  };
  tickers.push(tick);
}

// ---- 骰莊：四家各擲三顆骰子，最大的人當莊，平手的人重擲 ----
function pickDealer(cb){
  const tok = gameToken;
  const who2 = p => p === 0 ? '你' : NAMES[p];
  const round = (players, results) => {
    let i = 0;
    const next = () => {
      if (tok !== gameToken) return;
      if (i === players.length){
        const best = Math.max(...players.map(p => results[p]));
        const top = players.filter(p => results[p] === best);
        const summary = players.map(p => `${who2(p)} ${results[p]}`).join('、');
        if (top.length > 1){
          say('que', `${summary} 點。${top.map(who2).join('和')}一樣大，平手的人要再擲一次。`);
          return later(() => round(top, {}), 1800);
        }
        const w = top[0];
        say('que', `${summary} 點。${who2(w)}最大，${w === 0 ? '你' : who(w)}當第一個莊家，坐東。`);
        say('peng', w === 0 ? '你當莊！手氣不錯喔！' : `${NAMES[w]}當莊，我們來把莊拉下來！`);
        sfxChime([523, 659, 784]);
        NET.ev({ k:'pk', p:w });
        return later(() => { clearDice(); NET.ev({ k:'cd' }); cb(w); }, 2200);
      }
      const p = players[i];
      let done = false;
      const go = () => {
        if (done || tok !== gameToken) return; done = true;
        HOST.rollSeat = null; HOST.onRoll = null; NET.clear();
        V.hideActions();
        const vals = [1,2,3].map(() => 1 + Math.floor(Math.random()*6)), sum = vals[0] + vals[1] + vals[2];
        NET.ev({ k:'r', v:vals, p });
        rollDice(vals, () => {
          if (tok !== gameToken) return;
          results[p] = sum; V.announce(p, `${sum} 點`); i++;
          later(next, 900);
        }, p);
      };
      if (p === 0){ setBar([{ label:'🎲 擲骰子', cls:'pon', fn: go }], '骰莊：點數最大的人當莊', ftip('pick')); NET.wait('roll', [0], go); }
      else if (isHuman(p)){ HOST.rollSeat = p; HOST.rollWhy = 'pick'; HOST.onRoll = go; NET.wait('roll', [p], go); }
      else later(go, 500);
    };
    next();
  };
  say('que', '歡迎來到麻將雀碰！一將從「東風東」打到「北風北」。開始前要先「骰莊」：每個人擲三顆骰子，點數最大的人當第一個莊家，坐東。');
  say('peng', NET.role ? '輪到你的時候，下面會出現「擲骰子」！' : '先從你開始，快擲！');
  round([0,1,2,3], {});
}

function diceAndDeal(cb){

// ================= 洗牌：開局前把牌攤在桌上，按住拖曳就能洗 =================
const SHUF = { group:null, tiles:[], drag:null, dragging:false, last:null, building:false, auto:0, sound:0 };
function startShufflePile(){
  clearShufflePile();
  const g = new THREE.Group(); scene.add(g); SHUF.group = g; SHUF.tiles = [];
  for (let i=0;i<136;i++){
    const o = new THREE.Group(), m = tileMesh(0, 'hidden');
    m.rotation.x = Math.PI/2; o.add(m); o.scale.setScalar(WALL_S);
    const r = Math.sqrt(Math.random()) * 6.2, a = Math.random() * Math.PI * 2;
    o.position.set(Math.cos(a)*r, TD*WALL_S/2 + (i % 4) * 0.004, Math.sin(a)*r);
    o.rotation.y = Math.random() * Math.PI * 2;
    o.userData = { vx:0, vz:0, vr:0 };
    g.add(o); SHUF.tiles.push(o);
  }
  renderer.domElement.style.touchAction = 'none';
}
function clearShufflePile(){
  if (SHUF.group) scene.remove(SHUF.group);
  Object.assign(SHUF, { group:null, tiles:[], drag:null, dragging:false, last:null, building:false, auto:0 });
  if (renderer) renderer.domElement.style.touchAction = '';
}
function stepShuffle(){
  if (!SHUF.group || SHUF.building) return;
  const now = performance.now(), auto = now < SHUF.auto;
  let moving = 0;
  for (const o of SHUF.tiles){
    const u = o.userData, x = o.position.x, z = o.position.z;
    if (auto){ const r = Math.hypot(x, z) || 1; u.vx += (-z/r) * 0.05 + (Math.random()-.5) * 0.05; u.vz += (x/r) * 0.05 + (Math.random()-.5) * 0.05; u.vr += (Math.random()-.5) * 0.03; }
    if (SHUF.drag){
      const dx = x - SHUF.drag.x, dz = z - SHUF.drag.z, d = Math.hypot(dx, dz);
      if (d < 2.2){ const k = 1 - d/2.2; u.vx += SHUF.drag.dx * 0.32 * k + (Math.random()-.5) * 0.04 * k; u.vz += SHUF.drag.dz * 0.32 * k + (Math.random()-.5) * 0.04 * k; u.vr += (Math.random()-.5) * 0.1 * k; }
    }
    o.position.x += u.vx; o.position.z += u.vz; o.rotation.y += u.vr;
    u.vx *= 0.86; u.vz *= 0.86; u.vr *= 0.88;
    const r = Math.hypot(o.position.x, o.position.z);
    if (r > 6.6){ o.position.x *= 6.6/r; o.position.z *= 6.6/r; u.vx *= -0.3; u.vz *= -0.3; }
    moving += Math.abs(u.vx) + Math.abs(u.vz);
  }
  if (SHUF.drag){ SHUF.drag.dx *= 0.4; SHUF.drag.dz *= 0.4; }
  if (moving > 0.8 && now - SHUF.sound > 90){ SHUF.sound = now; shuffleSound(Math.min(1, moving / 12)); }
}
// 洗好後把牌堆成四面牌牆
function buildWalls(cb){
  if (!SHUF.group){ cb(); return; }
  SHUF.building = true;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const slots = [];
  for (let p=0;p<4;p++) for (let j=0;j<17;j++) for (let l=0;l<2;l++){
    const th = p * Math.PI / 2, lx = (-8 + j) * STEP * WALL_S, lz = WALL_R, y = (TD/2 + l*TD) * WALL_S;
    slots.push({ x: lx*Math.cos(th) + lz*Math.sin(th), z: -lx*Math.sin(th) + lz*Math.cos(th), y, th });
  }
  const order = SHUF.tiles.map((o, i) => i).sort(() => Math.random() - 0.5);
  const anim = SHUF.tiles.map((o, i) => {
    const sl = slots[order[i]];
    let th = sl.th; while (th - o.rotation.y > Math.PI/2) th -= Math.PI; while (o.rotation.y - th > Math.PI/2) th += Math.PI;
    return { o, from:{ x:o.position.x, y:o.position.y, z:o.position.z, r:o.rotation.y }, to:{ x:sl.x, y:sl.y, z:sl.z, r:th }, delay:(order[i] % 34) * 12 };
  });
  const t0 = performance.now(), dur = reduce ? 1 : 520;
  let clicks = 0;
  const tick = now => {
    let done = true;
    for (const a of anim){
      const e = Math.max(0, Math.min(1, (now - t0 - a.delay) / dur)), k = 1 - Math.pow(1 - e, 3);
      if (e < 1) done = false;
      a.o.position.set(a.from.x + (a.to.x - a.from.x)*k, a.from.y + (a.to.y - a.from.y)*k + Math.sin(e*Math.PI) * 0.6, a.from.z + (a.to.z - a.from.z)*k);
      a.o.rotation.y = a.from.r + (a.to.r - a.from.r)*k;
    }
    if (now - t0 > clicks * 90 && clicks < 9){ clicks++; clack(0.35); }
    if (done){ tickers.splice(tickers.indexOf(tick), 1); clearShufflePile(); cb(); }
  };
  tickers.push(tick);
}
function shuffleBar(onDone){
  setBar([{ label:'自動洗牌', cls:'chi', fn: () => { SHUF.auto = performance.now() + 1600; } },
          { label:'洗好了', cls:'pon', fn: () => { setBar([], '等其他人洗好牌…'); onDone(); } }],
    '洗牌：按住桌面拖曳，把牌洗亂', ftip('shuffle'));
}
function shufflePhase(cb){
  const tok = gameToken;
  startShufflePile();
  const humans = [0,1,2,3].filter(isHuman);
  HOST.shufDone = new Set();
  let finished = false;
  const finish = () => {
    if (finished || tok !== gameToken) return; finished = true;
    HOST.onShuf = null; NET.clear(); V.hideActions();
    NET.ev({ k:'bw' });
    say('peng', '砌牌囉！每家面前 17 墩、每墩 2 張。');
    buildWalls(() => { if (tok === gameToken) cb(); });
  };
  const mark = s => { if (finished) return; HOST.shufDone.add(s); if (humans.every(h => HOST.shufDone.has(h))) finish(); else NET.dirty(); };
  HOST.onShuf = mark;
  say('que', '開局前先洗牌。按住桌面拖曳就能把牌洗亂，洗好了按「洗好了」。');
  shuffleBar(() => mark(0));
  NET.wait('shuffle', humans, finish);
}

const fx = document.getElementById('fx'), fctx = fx.getContext('2d');
let parts = [], fxRunning = false;
function confetti(power){
  const dpr = Math.min(window.devicePixelRatio || 1, 2), W = fx.clientWidth, H = fx.clientHeight;
  fx.width = W*dpr; fx.height = H*dpr; fctx.setTransform(dpr,0,0,dpr,0,0);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const n = Math.round((reduce ? 50 : 240) * power);
  const cols = ['#e23b3b','#f2c14e','#2b8a5a','#fff4d6','#ff8a3d','#4f7bd9','#c9962b'];
  for (let i=0;i<n;i++){
    const side = i % 2, ribbon = i % 4 === 0;
    const a = side ? -Math.PI/2 - (0.25 + Math.random()*0.45) : -Math.PI/2 + (0.25 + Math.random()*0.45);
    const sp = (reduce ? 6 : 11) + Math.random()*9;
    parts.push({ x: side ? W + 10 : -10, y: H*0.92, vx: Math.cos(a)*sp*(W/1200 + 0.55), vy: Math.sin(a)*sp,
      rot: Math.random()*6, vr: (Math.random()-.5)*0.3, w: 6 + Math.random()*6, h: 10 + Math.random()*10,
      col: cols[i % cols.length], life: 0, ttl: 260 + Math.random()*120, wob: Math.random()*6, ribbon, trail: [] });
  }
  if (!fxRunning){ fxRunning = true; requestAnimationFrame(fxLoop); }
}
function fxLoop(){
  const W = fx.clientWidth, H = fx.clientHeight;
  fctx.clearRect(0,0,W,H);
  parts = parts.filter(p => p.life < p.ttl && p.y < H + 60);
  for (const p of parts){
    p.life++; p.vy = Math.min(p.vy + 0.25, p.ribbon ? 2.6 : 3.4); p.vx *= 0.985;
    p.x += p.vx + Math.sin(p.life*0.08 + p.wob)*0.9; p.y += p.vy; p.rot += p.vr;
    const fade = Math.min(1, (p.ttl - p.life)/40);
    fctx.globalAlpha = fade;
    if (p.ribbon){
      p.trail.push([p.x, p.y]); if (p.trail.length > 14) p.trail.shift();
      fctx.strokeStyle = p.col; fctx.lineWidth = 4; fctx.lineCap = 'round'; fctx.beginPath();
      p.trail.forEach(([x,y],i) => { const ox = Math.sin(i*0.9 + p.life*0.2)*4; i ? fctx.lineTo(x+ox,y) : fctx.moveTo(x+ox,y); });
      fctx.stroke();
    } else {
      fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.rot); fctx.scale(1, Math.cos(p.life*0.15 + p.wob));
      fctx.fillStyle = p.col; fctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); fctx.restore();
    }
  }
  fctx.globalAlpha = 1;
  if (parts.length) requestAnimationFrame(fxLoop); else { fxRunning = false; fctx.clearRect(0,0,W,H); }
}

// ---------- 自己的連線伺服器（Cloudflare）：在 claude.ai 以外的網址（例如 GitHub Pages）使用 ----------
// 部署好伺服器後，把網址填在這裡，例如 'https://mahjong-server.你的名稱.workers.dev'
const SERVER_URL = 'https://mahjong-server.koteika0222.workers.dev';
function serverRoomApi(){
  return /^https:\/\/[a-z0-9.-]+$/i.test(SERVER_URL.replace(/\/$/, '')) ? Object.freeze({ join: name => serverJoin(name) }) : null;
}
// 介面和 claude.ai 的即時連線一樣（join、emit、on、presence、onPeers、leave），上面的對戰程式不用分兩套
function serverJoin(name){
  return new Promise((resolve, reject) => {
    const listeners = {}, peerFns = [], connFns = [], peers = new Map();
    const myPres = {};
    let me = null, ws = null, opened = false, closed = false, retry = 0, pinger = null, lastRx = 0, retryT = null;
    const queue = [];   // 斷線時先排隊，連回來再送
    const url = SERVER_URL.replace(/\/$/, '').replace(/^http/, 'ws') + '/room/' + encodeURIComponent(name);
    const view = (peer, v) => Object.freeze({ peer, by:null, isMe:peer === me, sameTab:peer === me, kind:'viewer', guest:false, presence:Object.freeze({ ...v.presence }), updatedAt:v.updatedAt });
    const snapshot = () => Object.freeze([...peers.entries()].map(([p, v]) => view(p, v)));
    const notify = (joined, left, updated) => {
      const ps = snapshot();
      const ch = { peers:ps, joined:ps.filter(p => joined.includes(p.peer)), left, updated:ps.filter(p => updated.includes(p.peer)) };
      peerFns.forEach(f => { try { f(ch); } catch (e) { console.error(e); } });
    };
    const send = obj => { if (ws && ws.readyState === 1){ ws.send(JSON.stringify(obj)); return true; } return false; };
    const api = Object.freeze({
      name,
      emit(topic, data){
        const body = JSON.stringify({ t:'e', topic, d:data === undefined ? null : data });
        if (body.length > 7800) return Promise.reject({ code:'invalid_argument', message:'訊息太大' });
        if (ws && ws.readyState === 1 && me) ws.send(body);
        else { if (topic === 'mp.state') for (let i = queue.length - 1; i >= 0; i--) if (queue[i].includes('"topic":"mp.state"')) queue.splice(i, 1);
               queue.push(body); if (queue.length > 30) queue.shift(); }
        return Promise.resolve();
      },
      on(topic, fn){ (listeners[topic] = listeners[topic] || []).push(fn); return () => { listeners[topic] = listeners[topic].filter(f => f !== fn); }; },
      presence(patch){
        for (const [k, v] of Object.entries(patch || {})){ if (v === null) delete myPres[k]; else myPres[k] = v; }
        if (me){ peers.set(me, { presence:{ ...myPres }, updatedAt:Date.now() }); notify([], [], [me]); }
        send({ t:'p', d:patch });
        return Promise.resolve();
      },
      peers: snapshot,
      onPeers(fn){ peerFns.push(fn); setTimeout(() => { const ps = snapshot(); fn({ peers:ps, joined:ps, left:[], updated:[] }); }, 0); return () => {}; },
      connected: () => !!ws && ws.readyState === 1,
      onConnection(fn){ connFns.push(fn); setTimeout(() => fn(api.connected()), 0); return () => {}; },
      leave(){ closed = true; clearInterval(pinger); clearTimeout(retryT); try { ws.close(1000); } catch (e) {} return Promise.resolve(); }
    });
    const lost = sock => {
      if (sock !== ws) return;
      me = null; connFns.forEach(f => f(false));
      if (closed) return;
      if (!opened){ closed = true; reject({ code:'upstream_error', message:'連不上伺服器' }); return; }
      retry++; clearTimeout(retryT); retryT = setTimeout(connect, Math.min(5000, 400 * retry));   // 斷線自動重連
    };
    // 手機網路切換時，舊連線常常「沒斷但也不通」：太久沒收到任何訊息（包含心跳回覆）就直接換一條新的
    const kick = () => { const old = ws; if (!old) return; old.onclose = old.onmessage = old.onerror = null; try { old.close(); } catch (e) {} lost(old); };
    const wake = () => {
      if (closed || !opened) return;
      if (!ws || ws.readyState > 1 || (ws.readyState === 1 && Date.now() - lastRx > 12000)){ retry = 0; if (ws && ws.readyState === 1) kick(); else { clearTimeout(retryT); connect(); } }
      else if (ws.readyState === 1) ws.send('{"t":"ping"}');
    };
    window.addEventListener('online', wake);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
    const connect = () => {
      if (closed) return;
      const sock = new WebSocket(url); ws = sock; lastRx = Date.now();
      sock.onerror = () => {};
      sock.onmessage = ev => {
        if (sock !== ws) return;
        lastRx = Date.now();
        let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (!m || typeof m !== 'object') return;
        if (m.t === 'hi'){
          const before = new Map(peers);
          peers.clear(); me = String(m.peer); retry = 0;
          peers.set(me, { presence:{ ...myPres }, updatedAt:Date.now() });
          for (const p of Array.isArray(m.peers) ? m.peers : []) if (p && p.peer && !p.gone) peers.set(String(p.peer), { presence:p.presence || {}, updatedAt:Date.now() });
          if (Object.keys(myPres).length) send({ t:'p', d:myPres });
          while (queue.length && ws.readyState === 1) ws.send(queue.shift());
          connFns.forEach(f => f(true));
          if (!opened){ opened = true; resolve(api); }
          const left = [...before.entries()].filter(([p]) => !peers.has(p)).map(([p, v]) => view(p, v));
          notify([...peers.keys()].filter(p => !before.has(p)), left, []);
        } else if (m.t === 'pj' || m.t === 'pu'){
          const p = String(m.peer); if (p === me) return;
          const isNew = !peers.has(p);
          peers.set(p, { presence:m.presence && typeof m.presence === 'object' ? m.presence : {}, updatedAt:Date.now() });
          notify(isNew ? [p] : [], [], isNew ? [] : [p]);
        } else if (m.t === 'pl'){
          const p = String(m.peer), v = peers.get(p); if (!v) return;
          peers.delete(p); notify([], [view(p, v)], []);
        } else if (m.t === 'e' && typeof m.topic === 'string'){
          const msg = { topic:m.topic, data:m.d, peer:String(m.peer), by:null, isMe:m.peer === me, sameTab:m.peer === me, kind:'viewer', guest:false };
          (listeners[m.topic] || []).forEach(fn => { try { fn(msg); } catch (e) { console.error(e); } });
        }
      };
      sock.onclose = () => lost(sock);
    };
    connect();
    pinger = setInterval(() => {
      if (!ws || ws.readyState !== 1) return;
      if (Date.now() - lastRx > 20000) return kick();
      ws.send('{"t":"ping"}');
    }, 8000);
  });
}
