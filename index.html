  teacherOnEnd(res);
  setTimeout(() => { if (CL.hid === r.h) V.showResult(res); }, 1300);
}

// ---------- 開始畫面、房間 ----------
let roomReady = null;
function showStart(which){ ['stMode','stMulti','stLobby','stEnd'].forEach(id => { $(id).hidden = id !== which; }); $('start').hidden = false; }
function renderLobby(seats){
  const ol = $('lobbySeats'); ol.innerHTML = '';
  for (let i=0;i<4;i++){
    const st = seats[i], li = document.createElement('li'), b = document.createElement('b'), sp = document.createElement('span');
    b.textContent = st ? st.name : '空位';
    sp.textContent = st && st.cid === MP.cid ? (i === 0 ? '你・房主' : '你') : i === 0 ? '房主' : st ? '玩家' : '開始後由電腦補上';
    if (st && st.cid === MP.cid) li.className = 'me';
    if (!st) li.className = 'empty';
    li.append(b, sp); ol.appendChild(li);
  }
}
function mpEnded(text){
  $('endMsg').textContent = text;
  showStart('stEnd');
  V.hideActions();
}
function mpLeave(){
  try { if (MP.room) MP.room.leave(); } catch (e) {}
  location.reload();
}
function readName(){
  const n = cleanName($('mpName').value);
  if (n) try { localStorage.setItem('hm-name', n); } catch (e) {}
  return n;
}
async function mpRoomApi(){
  $('mpMsg').textContent = '連線中…';
  const r = await roomReady;
  $('mpMsg').textContent = r ? '' : window.claude ? '在 claude.ai 上多人對戰需要先登入，並由房主把你加成可以參與（Contributor）以上的成員。' : '多人對戰伺服器還沒設定好，目前只能單人遊玩。';
  $('btnCreate').disabled = $('btnJoin').disabled = !r;
  return r;
}
// 邀請朋友：複製一段邀請文字（含網站連結和房號）
function inviteLink(){
  if (window.claude || !/^https?:$/.test(location.protocol)) return '';
  return location.origin + location.pathname + '?room=' + MP.code.toUpperCase();
}
async function inviteFriends(){
  const link = inviteLink(), code = MP.code.toUpperCase();
  const text = `盡情打麻將吧！我邀請你加入麻將雀碰的行列${link ? '：' + link : ''}\n房間號碼是 ${code}`;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {}
  if (!ok){
    try {
      const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove();
    } catch (e) {}
  }
  $('inviteMsg').textContent = ok ? '已複製邀請訊息，貼給朋友就可以了！' : `沒辦法自動複製，請手動傳：${text.replace('\n', ' ')}`;
}
function enterRoomUi(isHost){
  showStart('stLobby');
  $('lobbyCode').textContent = MP.code.toUpperCase();
  $('lobbyHint').textContent = isHost ? '按「邀請朋友」複製邀請訊息貼給朋友，或直接告訴他房號。牌局在房主的畫面上進行，打牌時請房主不要切到別的 App 或關螢幕。' : '已加入房間。';
  $('inviteMsg').textContent = '';
  $('btnBegin').hidden = !isHost;
  $('btnNew').innerHTML = '離開<span class="long">房間</span>';
}
async function mpCreate(){
  const lobby = await mpRoomApi(); if (!lobby) return;
  const name = readName(); if (!name){ $('mpMsg').textContent = '先輸入你的暱稱。'; $('mpName').focus(); return; }
  $('btnCreate').disabled = true;
  try {
    MP.keys = await makeKeys();
    MP.code = randomCode(4); MP.name = name;
    MP.room = await lobby.join('mj-' + MP.code);
  } catch (e) { $('mpMsg').textContent = '建立房間失敗了，可能是連不上伺服器，請稍後再試。'; $('btnCreate').disabled = false; return; }
  hostInstall();
  HOST.seats[0] = { cid:MP.cid, name, peer:null, pk:null };
  NAMES[0] = name;
  const fail = e => { if (e && ['revoked','not_granted','capability_disabled','capability_removed'].includes(e.code)) mpEnded('連線中斷了，這場對局沒辦法繼續。'); };
  MP.room.presence({ role:'host', code:MP.code, name, cid:MP.cid, pk:MP.keys.pub }).catch(() => {});
  MP.room.onPeers(hostOnPeers, fail);
  MP.room.on('mp.act', hostOnAct, fail);
  avInstall();
  MP.beat = setInterval(() => { if (!MP.started) hostLobby(); else if (!HOST.dirtyT) hostBroadcast(); }, 2500);
  enterRoomUi(true);
  hostLobby();
  $('btnBegin').focus();
}
async function mpResume(){
  const info = resumeInfo(); if (!info) return;
  if (!info.host){
    // 玩家：用原本的代號重新加入
    MP.cid = info.cid; try { sessionStorage.setItem('hm-cid', info.cid); } catch (e) {}
    $('mpName').value = info.name || $('mpName').value; $('mpCode').value = info.code;
    CL.rejoin = true;
    showStart('stMulti');
    return mpJoin();
  }
  const S = info.snap;
  showStart('stMulti');
  const lobby = await mpRoomApi(); if (!lobby) return;
  $('btnResume').disabled = true;
  try {
    MP.keys = await makeKeys();
    MP.code = S.code; MP.name = S.name;
    MP.room = await lobby.join('mj-' + MP.code);
  } catch (e) { $('mpMsg').textContent = '回到房間失敗了，可能是連不上伺服器，請稍後再試。'; $('btnResume').disabled = false; return; }
  hostInstall();
  for (let i=0;i<4;i++){
    const x = S.seats[i];
    HOST.seats[i] = x ? { cid:String(x.cid), name:cleanName(x.name) || '玩家', peer:null, pk:null, gone:false } : null;
    NAMES[i] = S.nm[i]; SCORES[i] = S.sc[i] | 0; CTRL[i] = i === 0 ? 'local' : S.ctrl[i];
  }
  HOST.seats[0] = { cid:MP.cid, name:S.name, peer:null, pk:null };
  Object.assign(R, S.R);
  NET.hid = S.hid | 0; HOST.seq = (S.seq | 0) + 100; HOST.pid = (S.pid | 0) + 100;
  const fail = e => { if (e && ['revoked','not_granted','capability_disabled','capability_removed'].includes(e.code)) mpEnded('連線中斷了，這場對局沒辦法繼續。'); };
  MP.room.presence({ role:'host', code:MP.code, name:S.name, cid:MP.cid, pk:MP.keys.pub }).catch(() => {});
  MP.room.onPeers(hostOnPeers, fail);
  MP.room.on('mp.act', hostOnAct, fail);
  avInstall();
  MP.beat = setInterval(() => { if (!MP.started) hostLobby(); else if (!HOST.dirtyT) hostBroadcast(); }, 2500);
  enterRoomUi(true);
  MP.started = true;
  $('start').hidden = true;
  audio(); keepAwake();
  // 還沒回來的玩家先等 20 秒，沒回來就由電腦代打（回來後會自動換回本人）
  for (let s=1;s<4;s++){
    const st = HOST.seats[s];
    if (!st || CTRL[s] !== 'remote') continue;
    st.goneT = setTimeout(() => { st.goneT = null; if (st.peer || CTRL[s] !== 'remote') return; st.gone = true; CTRL[s] = 'ai'; hostSeatGone(s); NET.dirty(); }, 20000);
  }
  say('que', `回到房間 ${MP.code.toUpperCase()} 了，牌局從剛剛停下的地方接著打。`);
  restoreGame(S.g);
}
function restoreGame(g){
  gameToken++;
  if (!g || !Array.isArray(g.players) || g.players.length !== 4 || ['pick','intro','shuffle','dice','deal'].includes(g.phase)){ newGame(); return; }
  G = { wall:g.wall, players:g.players.map(P => ({ hand:P.hand, melds:P.melds, discards:P.discards, tenpaiFlag:!!P.tf, warned:!!P.w, meldWarned:!!P.mw })),
        turn:g.turn, phase:g.phase, last:g.last, lastDraw:g.lastDraw, ctx:null, result:g.result, humanDiscards:g.hd | 0,
        wk:g.wk, kanDraw:!!g.kd, drawBack:!!g.db, dealOrder:[[],[],[],[]] };
  if (scene){ clearDice(); clearShufflePile(); buildLabels(); }
  document.getElementById('result').hidden = true;
  V.render(G); NET.dirty();
  const tok = gameToken;
  // 等大家重新連上、交換金鑰，再從這一步接著進行
  later(() => {
    if (tok !== gameToken) return;
    const ph = G.phase, p = G.turn;
    if (ph === 'over'){ if (G.result){ V.showResult(G.result); NET.end(G.result); } else newGame(); return; }
    if ((ph === 'claims' || ph === 'humanClaim') && G.last){ G.phase = 'claims'; V.render(G); return beginClaims(G.last.from, G.last.tile); }
    const P = G.players[p]; if (!P) return newGame();
    const n = P.hand.length + 3 * P.melds.length;
    if (n >= 17) return drawAndPlay(p, false, false);
    const lastM = P.melds[P.melds.length - 1];
    const back = ph === 'draw' ? !!G.drawBack : !!(G.kanDraw || (ph === 'reveal' && lastM && /kan/.test(lastM.type)));
    startTurn(p, true, back);
  }, 1500);
}
async function mpJoin(){
  const lobby = await mpRoomApi(); if (!lobby) return;
  const name = readName(); if (!name){ $('mpMsg').textContent = '先輸入你的暱稱。'; $('mpName').focus(); return; }
  const code = String($('mpCode').value || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  if (code.length !== 4){ $('mpMsg').textContent = '房號是 4 個英文字母或數字。'; $('mpCode').focus(); return; }
  $('btnJoin').disabled = true;
  try {
    MP.keys = await makeKeys();
    MP.code = code; MP.name = name;
    MP.room = await lobby.join('mj-' + code);
  } catch (e) { $('mpMsg').textContent = '加入失敗了，可能是連不上伺服器，請稍後再試。'; $('btnJoin').disabled = false; return; }
  clientInstall();
  try { await MP.room.emit('mp.act', { x:'hi' }); }
  catch (e) {
    if (e && e.code === 'not_permitted'){
      try { MP.room.leave(); } catch (x) {}
      MP.room = null; NET.role = null; $('btnJoin').disabled = false;
      $('mpMsg').textContent = '你目前只有檢視權限，沒辦法出牌。請房主在分享設定裡，把你加成可以參與（Contributor）以上的成員。';
      return;
    }
  }
  const fail = e => { if (e && ['revoked','not_granted','capability_disabled','capability_removed'].includes(e.code)) mpEnded('連線中斷了，這場對局沒辦法繼續。'); };
  try { localStorage.setItem('hm-rejoin', JSON.stringify({ code, cid:MP.cid, name, ts:Date.now() })); } catch (e) {}
  MP.room.presence({ role:'player', code, name, cid:MP.cid, pk:MP.keys.pub }).catch(() => {});
  MP.room.onPeers(clientOnPeers, fail);
  MP.room.on('mp.state', clientOnState, fail);
  MP.room.on('mp.lobby', clientOnLobby, fail);
  MP.room.on('mp.end', clientOnEnd, fail);
  avInstall();
  enterRoomUi(false);
  renderLobby([null, null, null, null]);
  $('lobbyMsg').textContent = '正在找房間…';
  try { sessionStorage.setItem('hm-room', code); } catch (e) {}
  if (CL.rejoin){ $('lobbyMsg').textContent = ''; CL.hostAway = true; }
  setTimeout(() => {
    if (CL.sawHost || MP.started) return;
    if (CL.rejoin){ CL.hostGoneT = setTimeout(() => { mpEnded('房主一直沒有回來，這場對局結束。'); }, 30 * 60000); return; }
    try { MP.room.leave(); } catch (e) {}
    mpEnded(`找不到房號 ${code.toUpperCase()} 的房間。請確認房號，或請房主重新建立房間。`);
  }, 8000);
}

// 倒數計時：輪到自己時右下角出現小碼錶；別人的回合在上方顯示；吃碰的等待不說是誰
const SW = { lastSec:-1 };
setInterval(() => {
  const el = $('clock'), sw = $('stopwatch');
  if (!NET.role || !MP.started || !G){ el.hidden = true; sw.hidden = true; return; }
  const host = NET.role === 'host';
  const dl = host ? HOST.deadline : CL.deadline;
  const claim = host ? !!(HOST.prompt && HOST.prompt.kind === 'claim') : CL.waitClaim;
  const wait = host ? hostWaitSeats() : CL.wait;
  const mine = !CL.spect && (host ? wait.includes(0) : CL.pid != null);
  const total = host ? (HOST.prompt ? MPT[HOST.prompt.kind] || MPT.turn : 0) : CL.total;
  const left = dl ? Math.max(0, dl - Date.now()) : 0, sec = Math.ceil(left / 1000);
  // 自己的碼錶
  if (mine && dl){
    sw.hidden = false;
    const frac = total ? Math.max(0, Math.min(1, left / total)) : 0;
    sw.querySelector('.ring').style.strokeDashoffset = String(163.4 * (1 - frac));
    sw.querySelector('b').textContent = sec;
    sw.className = sec <= 5 ? 'hot' : sec <= 10 ? 'warm' : '';
    sw.querySelector('span').textContent = claim ? '要不要吃碰' : '思考時間';
    if (sec <= 5 && sec > 0 && sec !== SW.lastSec && sfxOn){ const ctx = audio(); if (ctx) tone(ctx, ctx.currentTime, 'sine', 1320, 1250, 0.05, 0.05); }
    SW.lastSec = sec;
  } else { sw.hidden = true; SW.lastSec = -1; }
  // 上方：別人的回合
  if (!dl || mine){ el.hidden = true; return; }
  if (claim){ el.textContent = '等其他玩家決定…'; el.hidden = false; return; }
  if (!wait.length){ el.hidden = true; return; }
  const names = wait.map(i => NAMES[i]).join('、');
  el.textContent = sec ? `等 ${names}・${sec} 秒` : `等 ${names}…`;
  el.classList.toggle('me', mine);
  el.hidden = false;
}, 250);

// ---------- 連線對局的保險：心跳、看門狗、提示 ----------
setInterval(() => {
  if (!NET.role || !MP.started) return;
  const now = Date.now();
  if (NET.role === 'host' && G){
    // 看門狗：思考時間到了計時器卻沒觸發（分頁在背景、計時器被瀏覽器延後）就直接處理
    if (HOST.onTimeout && HOST.deadline && now > HOST.deadline + 1500){ const f = HOST.onTimeout; NET.clear(); try { f(); } catch (e) { console.error(e); } }
    // 心跳：就算沒有變化也定時補送牌桌，掉了的訊息、剛重新連上的人都能馬上跟上
    if (now - HOST.lastSend > 2500) hostBroadcast();
    // 結算畫面的訊息也可能掉，局結束後定時補送（大家收到同一局只會顯示一次）
    if (G.phase === 'over' && HOST.lastEnd && HOST.lastEnd.h === NET.hid && now - (HOST.endAt || 0) > 3000){
      HOST.endAt = now; const r = HOST.lastEnd; HOST.chain = HOST.chain.then(() => MP.room.emit('mp.end', r).catch(() => {}));
    }
    netWarn('');
  } else if (NET.role === 'client'){
    if (CL.hostAway) netWarn('房主離開了，牌局先暫停。房主重新打開網頁、按「回到房間」就能接著打。');
    else if (CL.lastRx && now - CL.lastRx > 8000 && !(G && G.phase === 'over'))
      netWarn('好一陣子沒有收到房主的牌桌了。房主的遊戲畫面可能被切到背景、螢幕關掉或網路不穩，請房主回到遊戲畫面。');
    else netWarn('');
  }
}, 1000);
setInterval(() => {
  if (NET.role === 'client' && MP.code){ try { localStorage.setItem('hm-rejoin', JSON.stringify({ code:MP.code, cid:MP.cid, name:MP.name, ts:Date.now() })); } catch (e) {} }
  if (NET.role === 'host' && MP.started) hostSave();
}, 15000);
function netWarn(t){ const el = $('netWarn'); if (!el) return; if (el.textContent !== t) el.textContent = t; el.hidden = !t; }
// 連線對局時不讓手機自動關螢幕（關螢幕時瀏覽器會暫停網頁，房主關螢幕整桌就會停住）
let wakeLock = null;
async function keepAwake(){
  if (!MP.started || document.hidden || wakeLock || !navigator.wakeLock) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (!NET.role || !MP.started) return;
  if (document.hidden){ if (NET.role === 'host') HOST.awayAt = Date.now(); return; }
  keepAwake();
  if (NET.role === 'host'){
    hostBroadcast();
    if (HOST.awayAt && Date.now() - HOST.awayAt > 4000)
      say('que', '你剛剛離開了遊戲畫面。你是房主，整桌的牌局都在你的畫面上進行，離開時大家都會停住喔！');
    HOST.awayAt = 0;
  }
});

(async function boot(){
  try { await Promise.race([Promise.all([document.fonts.load(`900 60px "Noto Sans TC"`, '一二三四五六七八九萬東南西北中發白'), document.fonts.load(`700 30px "Noto Sans TC"`, '剩餘下家對家上家阿福小玉老陳')]), new Promise(r => setTimeout(r, 3000))]); } catch (e) {}
  try { await Promise.race([document.fonts.load('80px "Yuji Boku"', '東南西北風開局'), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  try { await window.TK_READY; await Promise.race([document.fonts.load('900 60px "momochidori"', '一二三四五六七八九萬東南西北中發白'), new Promise(r => setTimeout(r, 1500))]); } catch (e) {}
  init3D();
  // 只有在 claude.ai 上打開時才有即時連線；其他地方 roomReady 會是 null
  // 在 claude.ai 上用頁面內建的即時連線；其他網址（例如 GitHub Pages）用自己的 Cloudflare 伺服器
  roomReady = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('room').catch(() => null) : Promise.resolve(serverRoomApi());
  try { $('mpName').value = localStorage.getItem('hm-name') || ''; } catch (e) {}
  try { $('mpCode').value = (sessionStorage.getItem('hm-room') || '').toUpperCase(); } catch (e) {}
  showStart('stMode');
  $('btnSolo').addEventListener('click', () => { audio(); $('start').hidden = true; newGame(); });
  $('btnMulti').addEventListener('click', () => { audio(); showStart('stMulti'); $('mpMsg').textContent = ''; mpRoomApi(); ($('mpName').value ? $('btnCreate') : $('mpName')).focus(); });
  $('btnBack').addEventListener('click', () => { showStart('stMode'); $('btnMulti').focus(); });
  $('btnInvite').addEventListener('click', inviteFriends);
  // 從邀請連結打開：直接進到多人對戰，房號已經填好
  try {
    const rc = (new URLSearchParams(location.search).get('room') || '').toLowerCase();
    if (/^[a-z0-9]{4}$/.test(rc)){ $('mpCode').value = rc.toUpperCase(); showStart('stMulti'); $('mpMsg').textContent = `朋友邀請你加入房間 ${rc.toUpperCase()}，輸入暱稱後按「加入」。`; }
  } catch (e) {}
  $('btnCreate').addEventListener('click', mpCreate);
  $('btnJoin').addEventListener('click', mpJoin);
  $('mpCode').addEventListener('keydown', e => { if (e.key === 'Enter') mpJoin(); });
  $('btnBegin').addEventListener('click', hostBegin);
  const ri = resumeInfo();
  if (ri){
    $('resumeBox').hidden = false;
    $('btnResume').textContent = `回到房間 ${ri.code.toUpperCase()}${ri.host ? '（你是房主）' : ''}`;
    $('btnResume').addEventListener('click', mpResume);
    $('btnResumeDrop').addEventListener('click', () => { resumeForget(); $('resumeBox').hidden = true; });
  }
  $('btnLeave').addEventListener('click', mpLeave);
  $('btnHome').addEventListener('click', mpLeave);
  const fb = $('btnFriendly');
  const syncFriendly = () => { fb.setAttribute('aria-pressed', FRIENDLY); fb.setAttribute('aria-checked', FRIENDLY); fb.title = FRIENDLY ? '新手友善模式：開' : '新手友善模式：關'; };
  fb.addEventListener('click', () => {
    FRIENDLY = !FRIENDLY; syncFriendly();
    try { localStorage.setItem('hm-friendly', FRIENDLY ? 'on' : 'off'); } catch (e) {}
    say('que', FRIENDLY ? '新手友善模式開啟了！打牌時畫面下方會有小字告訴你現在可以做什麼，滑到牌上也會顯示牌名。' : '新手友善模式關掉了，現在是正常遊玩。');
    if (BAR.last && actionsEl.classList.contains('show')){ const b = BAR.last; setBar(b.btns, b.note, b.tip || (FRIENDLY ? b.tip : '')); }
  });
  syncFriendly();
  $('btnSolo').focus();
})();
